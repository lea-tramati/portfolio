<meta property="og:url" content="https://lea-tramati.github.io/portfolio/">

<title>Léa Tramati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=Courier+Prime:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Page blanche, encre noire, un fil rouge. Un seul thème, volontairement. */
:root {
  --paper: #FFFFFF;
  --ink: #111111;
  --soft: #6B6B6B;
  --faint: #E9E9E6;
  --red: #E3261C;
  --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "Courier Prime", "Courier New", Courier, monospace;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 15px/1.45 var(--sans);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
}
img { max-width: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

/* ---------- Pastilles (boutons, étiquettes) ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1.5px solid var(--ink); border-radius: 99px;
  background: var(--paper); color: var(--ink);
  font: 600 12px/1 var(--sans); text-transform: uppercase; letter-spacing: .01em;
  padding: 6px 10px 5px;
  text-decoration: none; white-space: nowrap; cursor: pointer;
  transition: background .15s, color .15s, gap .2s;
}
.pill:hover, .pill[aria-pressed="true"], .pill.solid { background: var(--ink); color: var(--paper); }
.pill.solid:hover { background: var(--red); border-color: var(--red); }
.pill.big { font-size: 14px; padding: 11px 16px 10px; }
.pill.big:hover { gap: 12px; }

/* ---------- Barres haut et bas ---------- */
.bar {
  position: fixed; left: 0; right: 0; z-index: 30;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  padding-inline: 20px;
  pointer-events: none;
}
.bar > * { pointer-events: auto; }
#top { top: 0; padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
#name { font: 500 17px/1.1 var(--sans); letter-spacing: -.01em; justify-self: start; }
#name small { display: block; font: 400 13px/1.3 var(--mono); color: var(--soft); letter-spacing: 0; }
nav { display: flex; gap: 6px; }
#right { justify-self: end; display: flex; align-items: center; gap: 14px; }
.langs { display: flex; gap: 2px; }
.langs button {
  background: none; border: 0; cursor: pointer; padding: 6px 5px;
  font: 400 14px/1 var(--mono); color: var(--soft);
}
.langs button:hover, .langs button[aria-pressed="true"] { color: var(--ink); }
.langs button[aria-pressed="true"] { text-decoration: underline; text-underline-offset: 4px; }
#full { background: none; border: 0; cursor: pointer; padding: 6px; font: 400 14px/1 var(--mono); color: var(--soft); }
#full:hover { color: var(--ink); }

#bottom { bottom: 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); align-items: end; }
#hint { font: 400 13px/1.35 var(--mono); color: var(--soft); justify-self: start; max-width: 30ch; }
#hint b { font-weight: 400; color: var(--ink); }
#filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; }
#filters button {
  background: none; border: 0; cursor: pointer; padding: 4px 0;
  font: 400 16px/1 var(--sans); color: var(--soft);
}
#filters button:hover, #filters button[aria-pressed="true"] { color: var(--ink); }
#filters button[aria-pressed="true"] { text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
#filters sup { font-size: 10px; margin-left: 1px; }
.qr { justify-self: end; display: flex; align-items: end; gap: 10px; text-align: right; }
.qr span { font: 400 12px/1.3 var(--mono); color: var(--soft); max-width: 16ch; }
.code { background: #fff; line-height: 0; }
.code canvas, .code img { display: block; }
.qr .code canvas, .qr .code img { width: 62px; height: 62px; }

/* ---------- Champ d'images ---------- */
#stage {
  position: relative; z-index: 0; isolation: isolate;
  height: 100%; overflow: hidden;
  cursor: grab; touch-action: pan-y;
}
#stage.dragging { cursor: grabbing; }
#web { position: absolute; inset: 0; z-index: 2; pointer-events: none; }

.card {
  position: absolute; left: 0; top: 0; z-index: 10;
  display: grid; gap: 7px; justify-items: start;
  padding: 0; border: 0; background: none; text-align: left;
  cursor: pointer; will-change: transform;
  transition: opacity .5s;
}
.shot { position: relative; display: block; width: 100%; }
.shot img, .shot video { display: block; width: 100%; height: auto; aspect-ratio: var(--r); object-fit: cover; object-position: top; }
.shot::before, .photo::before {
  content: ""; position: absolute; left: 50%; top: -4px; z-index: 2;
  width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--red);
}
.shot .over {
  position: absolute; inset: 0; display: grid; place-items: center;
  font: 700 15px/1.1 var(--sans); color: #fff; text-transform: uppercase; text-align: center;
  background: rgba(17,17,17,.35); opacity: 0; transition: opacity .2s;
}
.card:hover .over, .card:focus-visible .over { opacity: 1; }
.cap { font: 400 13px/1.3 var(--mono); color: var(--ink); }
.cap .n { color: var(--red); }
.cap .c { color: var(--soft); }
.card.dim { opacity: .12; pointer-events: none; }
.card.pulse .shot { animation: pulse 1.6s ease-out; }
@keyframes pulse { from { box-shadow: 0 0 0 0 rgba(227,38,28,.6); } to { box-shadow: 0 0 0 20px rgba(227,38,28,0); } }

.photo {
  position: absolute; left: 0; top: 0; z-index: 1;
  pointer-events: none; will-change: transform;
  transition: opacity .5s;
}
.photo img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
body.intro .photo, body.filtered .photo { opacity: .25; }
body.intro .card { opacity: .25; }
body.indexview .bar { background: var(--paper); }
body.indexview #top { padding-bottom: 12px; }
body.indexview #bottom { padding-top: 12px; }
body.indexview #hint { visibility: hidden; }

/* ---------- Accueil (carte blanche, grand titre) ---------- */
#intro {
  position: fixed; z-index: 20;
  left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(1040px, calc(100vw - 32px));
  background: var(--paper);
  padding: 22px 24px 20px;
  box-shadow: 0 30px 80px rgba(0,0,0,.12);
  pointer-events: none;
  opacity: 0; transition: opacity .5s, transform .5s;
}
body.intro #intro { opacity: 1; }
body:not(.intro) #intro { transform: translate(-50%, -47%); }
.hl { margin: 0; font: 800 clamp(26px, 6.3vw, 86px)/.9 var(--sans); letter-spacing: -.045em; text-transform: uppercase; }
.hl .row { display: flex; align-items: center; justify-content: space-between; gap: .18em; white-space: nowrap; }
.hl .row > span { flex: none; }
.hl .row + .row { margin-top: .06em; }
.hl .pill { font-size: max(10px, .1em); letter-spacing: 0; padding: .45em .8em .38em; align-self: flex-start; margin-top: .25em; }
.hl .inset { height: .78em; width: auto; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
.hl .gap { flex: 1; }
#intro .tip { margin: 18px 0 0; font: 400 14px/1.4 var(--mono); color: var(--soft); }
#intro .tip b { font-weight: 400; color: var(--red); }

/* ---------- Index (grille dense) ---------- */
#index {
  position: fixed; inset: 0; z-index: 25;
  background: var(--paper);
  overflow-y: auto;
  padding-inline: 20px;
  padding-block: calc(78px + env(safe-area-inset-top, 0px)) calc(100px + env(safe-area-inset-bottom, 0px));
  -webkit-user-select: text; user-select: text;
}
#index .lead { font: 400 15px/1.45 var(--mono); margin: 0 0 14px; max-width: 110ch; }
#index .lead button { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--faint); }
#index .lead button:hover { color: var(--red); text-decoration-color: var(--red); }
#index .lead .c { color: var(--soft); }
.grid { display: flex; flex-wrap: wrap; gap: 6px; }
.grid button { position: relative; padding: 0; border: 0; background: none; cursor: pointer; height: 220px; }
.grid img { display: block; height: 100%; width: auto; }
.grid .tag {
  position: absolute; left: 6px; bottom: 6px;
  font: 400 12px/1.2 var(--mono); background: var(--paper); color: var(--ink); padding: 2px 5px;
  opacity: 0; transition: opacity .15s;
}
.grid button:hover .tag, .grid button:focus-visible .tag { opacity: 1; }
.grid .dim { display: none; }
.grid.photos button { height: 120px; cursor: zoom-in; }
#index h3 { font: 400 15px/1.4 var(--mono); margin: 28px 0 10px; }

/* ---------- Fiche projet : la vague ---------- */
#focus { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
#focus.on { pointer-events: auto; }
#focus:not(.on) .side, #focus:not(.on) .count { visibility: hidden; }
.flood {
  position: absolute; left: -5%; right: -5%; top: 0; height: 100%;
  background: var(--c, #F2F2F0);
  transform: translateY(115%);
  transition: transform .9s cubic-bezier(.7,0,.2,1);
}
.flood svg { position: absolute; left: 0; bottom: 100%; width: 100%; height: 140px; display: block; }
.flood svg path { fill: var(--c, #F2F2F0); }
#focus.on .flood { transform: translateY(0); }
.inner {
  position: absolute; inset: 0; overflow-y: auto;
  display: grid; place-items: center;
  padding-inline: 20px;
  padding-block: calc(64px + env(safe-area-inset-top, 0px)) calc(64px + env(safe-area-inset-bottom, 0px));
  opacity: 0; transition: opacity .3s;
}
#focus.on .inner { opacity: 1; transition: opacity .5s .55s; }
.sheet { display: grid; grid-template-columns: auto minmax(0, 380px); align-items: end; gap: 40px; max-width: 100%; }
.big {
  display: block; position: relative; cursor: pointer; line-height: 0;
  transform: translateY(24px); transition: transform .7s cubic-bezier(.2,.8,.2,1) .5s;
}
#focus.on .big { transform: none; }
.big img { display: block; max-width: min(54vw, 560px); max-height: 66vh; width: auto; height: auto; }
.info { display: grid; gap: 14px; justify-items: start; }
.info .k { font: 400 14px/1.3 var(--mono); }
.info h2 { margin: 0; font: 800 clamp(36px, 5.2vw, 72px)/.88 var(--sans); letter-spacing: -.045em; text-transform: uppercase; text-wrap: balance; }
.info p { margin: 0; font-size: 17px; line-height: 1.45; max-width: 36ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags .pill { cursor: default; }
.tags .pill:hover { background: transparent; color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.process { display: flex; flex-wrap: wrap; gap: 4px; max-height: 150px; overflow-y: auto; }
.process:empty { display: none; }
.process button { padding: 0; border: 0; cursor: zoom-in; line-height: 0; }
.process img { width: 50px; height: 50px; object-fit: cover; }
.pqr { display: flex; align-items: center; gap: 12px; }
.pqr .code canvas, .pqr .code img { width: 72px; height: 72px; }
.pqr span { font: 400 12px/1.35 var(--mono); max-width: 22ch; }
.side { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); }
#close { right: 20px; }
#prev { left: 20px; }
#next { left: 88px; }
#focus .count { position: absolute; left: 20px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); font: 400 13px/1 var(--mono); }
.flyer { position: fixed; z-index: 45; margin: 0; pointer-events: none; transform-origin: 0 0; }
#focus.flip .big { opacity: 0; transition: none; transform: none; }

/* ---------- Agrandissement ---------- */
#zoom { position: fixed; inset: 0; z-index: 50; background: rgba(255,255,255,.97); display: grid; place-items: center; padding: 60px 20px; cursor: zoom-out; }
#zoom img, #zoom video { max-width: 100%; max-height: calc(100vh - 120px); display: block; }
#zoom img.nav { cursor: e-resize; }
#zoom video { cursor: default; background: #000; }
#zoomClose { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 20px; }
#zoomCount { position: absolute; left: 20px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); font: 400 13px/1 var(--mono); }

/* ---------- À propos ---------- */
#about { position: fixed; z-index: 55; inset: 0; display: flex; justify-content: flex-end; background: rgba(17,17,17,.2); }
#about .panel {
  width: min(480px, 100%); height: 100%; overflow-y: auto;
  background: var(--paper);
  padding-inline: 28px;
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
  display: grid; align-content: start; gap: 20px;
  animation: slide .45s cubic-bezier(.2,.8,.2,1);
  -webkit-user-select: text; user-select: text;
}
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
#about .top { display: flex; justify-content: space-between; align-items: center; }
#about .portrait { width: 56%; aspect-ratio: 4 / 5; background: var(--ink); color: var(--paper); display: grid; place-items: center; font: 800 96px/1 var(--sans); letter-spacing: -.05em; overflow: hidden; }
#about .portrait img { width: 100%; height: 100%; object-fit: cover; }
#about h2 { margin: 0; font: 800 52px/.88 var(--sans); letter-spacing: -.045em; text-transform: uppercase; }
#about p { margin: 0; font-size: 17px; line-height: 1.5; max-width: 38ch; }
#about dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font: 400 14px/1.4 var(--mono); }
#about dt { color: var(--soft); }
#about dd { margin: 0; overflow-wrap: anywhere; }
#about a { color: var(--ink); }

/* ---------- Mode démo ---------- */
#demo {
  position: fixed; z-index: 60; left: 50%; transform: translateX(-50%);
  bottom: calc(70px + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}
#demo::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .2; } }

@media (max-width: 760px) {
  .bar { grid-template-columns: 1fr auto; }
  #top nav { grid-column: 1 / -1; grid-row: 2; justify-self: start; }
  #bottom { grid-template-columns: 1fr auto; }
  #hint { display: none; }
  #filters { justify-content: start; gap: 4px 12px; }
  #filters button { font-size: 14px; }
  .qr span { display: none; }
  .qr .code canvas, .qr .code img { width: 50px; height: 50px; }
  #intro { padding: 16px; }
  .sheet { grid-template-columns: 1fr; gap: 22px; justify-items: start; }
  .big img { max-width: calc(100vw - 40px); max-height: 40vh; }
  .pqr { display: none; }
  .grid button { height: 130px; }
  .grid.photos button { height: 84px; }
  #index { padding-top: calc(118px + env(safe-area-inset-top, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  .flood, .inner, .big { transition-duration: .01s !important; transition-delay: 0s !important; }
  #demo::before, .card.pulse .shot { animation: none; }
}
</style>
</head>
<body>

<main id="stage"></main>

<header class="bar" id="top">
  <div id="name">Léa Tramati<small data-t="context"></small></div>
  <nav aria-label="Navigation">
    <button class="pill" type="button" id="navField" data-t="explore"></button>
    <button class="pill" type="button" id="navIndex" data-t="index"></button>
    <button class="pill" type="button" id="navAbout" data-t="about"></button>
  </nav>
  <div id="right">
    <div class="langs" role="group" aria-label="Langue / Language / Sprache">
      <button type="button" data-lang="fr" id="lang-fr">FR</button>
      <button type="button" data-lang="en" id="lang-en">EN</button>
      <button type="button" data-lang="de" id="lang-de">DE</button>
    </div>
    <button id="full" type="button">[ ]</button>
  </div>
</header>

<footer class="bar" id="bottom">
  <div id="hint"></div>
  <div id="filters" role="group"></div>
  <div class="qr" aria-hidden="true">
    <span data-t="scanSite"></span>
    <div class="code" id="siteQr"></div>
  </div>
</footer>

<div id="intro" aria-live="polite">
  <h1 class="hl" id="hl"></h1>
  <p class="tip" id="tip"></p>
</div>

<section id="index" hidden></section>

<span class="pill solid" id="demo" hidden><span data-t="demo"></span></span>

<section id="focus" aria-hidden="true">
  <div class="flood">
    <svg viewBox="0 0 1200 140" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 140 L0 96 C 180 112, 300 64, 520 40 C 760 14, 960 70, 1200 22 L1200 140 Z"></path>
    </svg>
  </div>
  <div class="inner">
    <div class="sheet">
      <a class="big" id="big"></a>
      <div class="info">
        <span class="k" id="fKind"></span>
        <h2 id="fTitle"></h2>
        <p id="fDesc"></p>
        <div class="tags" id="fTags"></div>
        <div class="actions" id="fActions"></div>
        <div class="process" id="fProcess"></div>
        <div class="pqr" aria-hidden="true"><div class="code" id="projQr"></div><span id="fScan"></span></div>
      </div>
    </div>
  </div>
  <button class="pill side" id="prev" type="button">←</button>
  <button class="pill side" id="next" type="button">→</button>
  <button class="pill side" id="close" type="button"></button>
  <span class="count" id="fCount"></span>
</section>

<div id="about" hidden>
  <aside class="panel" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
    <div class="top"><span class="pill" data-t="about"></span><button class="pill" id="aboutClose" type="button"></button></div>
    <div class="portrait" id="portrait"></div>
    <h2 id="aboutTitle">Léa<br>Tramati</h2>
    <p data-t="bio1"></p>
    <p data-t="bio2"></p>
    <dl>
      <dt data-t="where"></dt><dd>KISD — Köln International School of Design</dd>
      <dt data-t="what"></dt><dd data-t="fields"></dd>
      <dt data-t="contact"></dt><dd id="contact"></dd>
      <dt>GitHub</dt><dd><a href="https://github.com/lea-tramati" target="_blank" rel="noopener">github.com/lea-tramati</a></dd>
    </dl>
  </aside>
</div>

<div id="zoom" hidden>
  <button class="pill" id="zoomClose" type="button"></button>
  <div id="zoomBody"></div>
  <span id="zoomCount"></span>
</div>

<script>
/* ═══════════════ RÉGLAGES ═══════════════
   SITE_URL : adresse publique (QR codes).
   Mode expo : ajouter #expo à l'adresse → démo automatique après IDLE_SECONDS sans activité,
   les projets s'ouvrent dans le même onglet. */
const SITE_URL = "https://lea-tramati.github.io/portfolio/";
const IDLE_SECONDS = 30;
const DEMO_STEP_SECONDS = 8;
/* Photo pour « À propos » : par ex. "vignettes/portrait.jpg" (vide : initiales). */
const PORTRAIT = "";
/* Contact affiché dans « À propos » : par ex. { label: "@lea.tramati", href: "https://instagram.com/lea.tramati" } */
const CONTACT = null;

/* Photos d'ambiance : soirée « potluck! ». Non cliquables dans le champ, en galerie dans le projet Potluck. */
const PHOTOS = ["photos/IMG_1411.jpg","photos/IMG_1412.jpg","photos/IMG_1413.jpg","photos/IMG_1414.jpg","photos/IMG_1415.jpg","photos/IMG_1416.jpg","photos/IMG_1417.jpg","photos/IMG_1418.jpg","photos/IMG_1419.jpg","photos/IMG_1420.jpg","photos/IMG_1421.jpg","photos/IMG_1422.jpg","photos/IMG_1423.jpg","photos/IMG_1424.jpg","photos/IMG_1425.jpg","photos/IMG_1426.jpg","photos/IMG_1427.jpg","photos/IMG_1428.jpg","photos/IMG_1429.jpg","photos/IMG_1430.jpg","photos/IMG_1431.jpg","photos/IMG_1432.jpg","photos/IMG_1434.jpg","photos/IMG_1435.jpg","photos/IMG_1436.jpg","photos/IMG_1437.jpg","photos/IMG_1438.jpg","photos/IMG_1439.jpg","photos/IMG_1440.jpg","photos/IMG_1443.jpg","photos/IMG_1444.jpg"];

/* ═══════════════ PROJETS ═══════════════
   type : "lien" (ouvre une adresse), "affiche" (s'agrandit), "galerie" (photos)
   groupes : pour les filtres en bas de page */
const PROJETS = [
  { id: "intrusion", titre: "Intrusion", type: "lien", format: "paysage", couleur: "#FF8A6B", groupes: ["jeu"],
    image: "vignettes/intrusion.jpg", lien: "https://lea-tramati.github.io/intrusion/",
    tags: ["Unity", "WebGL"],

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const mod = (a, n) => ((a % n) + n) % n;

const EXPO = location.hash === "#expo";
const RATIOS = { paysage: 4 / 3, portrait: 3 / 4, carre: 1, affiche: 1 / 1.414 };
const RED = "#E3261C";

function rng(seed) {
  let h = 2166136261 >>> 0;
  for (const ch of String(seed)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return () => {

    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;

}

}

const web = document.createElement("canvas");

function build() {

  const small = vw < 640;

  const n = liste.length;

  const gap = world / n;

  items = liste.map((i, k) => {
    const p = PROJETS[i];
    const ratio = RATIOS[p.format] || 4 / 3;
    const base = (small ? 120 : 175) + r() * (small ? 40 : 70);
    const w = Math.round(base * (ratio < 1 ? 0.78 : 1));
    const h = w / ratio;
    const y = k % 2 ? vh * (small ? 0.47 : 0.5) + r() * vh * 0.05 : vh * (small ? 0.2 : 0.16) + r() * vh * 0.05;

    const b = document.createElement("button");

    b.style.width = w + "px";
    b.setAttribute("aria-label", `${p.titre}, ${p.cat[lang]}. ${t("cardHint")}`);
    const f = document.createElement("span");
    f.className = "shot";
    f.append(thumb(p, w * 2));
    const over = document.createElement("span");
    over.className = "over"; over.textContent = t("open").replace(/^./, c => c) + " →";
    f.append(over);
    const cap = document.createElement("span");
    cap.className = "cap";
    cap.innerHTML = '<span class="n"></span> <span class="t"></span> <span class="c"></span>';
    cap.querySelector(".n").textContent = pad(i + 1);
    cap.querySelector(".t").textContent = p.titre;
    cap.querySelector(".c").textContent = `[${p.cat[lang]}]`;
    const cta = document.createElement("span");
    cta.className = "pill"; cta.innerHTML = '<span></span><span aria-hidden="true">→</span>';
    cta.firstChild.textContent = t("open");
    b.append(f, cap, cta);
    b.addEventListener("click", e => { if (moved > 6) { e.preventDefault(); return; } openFocus(i, false, f); });
    if (p.video) {
      b.addEventListener("pointerenter", e => {
        if (e.pointerType !== "mouse") return;
        const v = document.createElement("video");
        v.src = p.video; v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true;

    }

    stage.append(b);
    const item = { el: b, p, base: k * gap + r() * gap * 0.3, y, w, h: h + 70, phase: r() * 6.28 };
    return item;
  });

  /* Photos dans les espaces libres, sans recouvrir projets, en-tête et pied de page */
  const boxes = items.map(it => ({ x: it.base - 16, y: it.y - 16, w: it.w + 32, h: it.h + 24 }));
  const top = vh * (small ? 0.2 : 0.14), bottom = vh * 0.82;

    const w = Math.round((small ? 56 : 74) + r() * (small ? 30 : 56));
    const h = w * 0.75;

      const x = ((j + r()) / PHOTOS.length) * world + (tries ? (r() - 0.5) * gap * 1.4 : 0);
      const y = top + r() * Math.max(10, bottom - top - h);
      const box = { x: x - 12, y: y - 12, w: w + 24, h: h + 24 };
      const hit = boxes.some(o => {
        const dx = mod(box.x - o.x + world / 2, world) - world / 2;
        return dx < o.w && -dx < box.w && box.y < o.y + o.h && o.y < box.y + box.h;

      boxes.push(box);
      const el = document.createElement("div");

      const img = new Image(); img.src = src; img.alt = ""; img.draggable = false; img.decoding = "async";

      photoItems.push({ el, base: x, y, w, h, phase: r() * 6.28 });
      break;
    }
  });

  sizeWeb();
  place();
}

function sizeWeb() {
  const d = Math.min(2, devicePixelRatio || 1);
  web.width = Math.round(stage.clientWidth * d);
  web.height = Math.round(stage.clientHeight * d);
  web.style.width = stage.clientWidth + "px";
  web.style.height = stage.clientHeight + "px";
  web.getContext("2d").setTransform(d, 0, 0, d, 0, 0);
}

let mx = 0, my = 0, tmx = 0, tmy = 0;
function position(it, now) {
  const x = mod(it.base - offset, world) - 280;
  it.x = x;
  const bob = reduce ? 0 : Math.sin(now * 0.0007 + it.phase) * 6;
  it.sx = x + mx * 16;
  it.sy = it.y + bob + my * 10;
  it.el.style.transform = `translate3d(${it.sx.toFixed(1)}px, ${it.sy.toFixed(1)}px, 0)`;
  it.px = it.sx + it.w / 2;
  it.py = it.sy;
}
function place() {
  const now = performance.now();
  for (const it of photoItems) position(it, now);
  for (const it of items) position(it, now);
  drawWeb();
}
function thread(ctx, a, b, sag) {
  const d = Math.hypot(b.px - a.px, b.py - a.py);
  ctx.beginPath();
  ctx.moveTo(a.px, a.py);
  ctx.quadraticCurveTo((a.px + b.px) / 2, (a.py + b.py) / 2 + d * sag, b.px, b.py);
  ctx.stroke();
}
function drawWeb() {
  const ctx = web.getContext("2d");
  const vw = stage.clientWidth, vh = stage.clientHeight;
  ctx.clearRect(0, 0, vw, vh);
  ctx.lineCap = "round";
  const vis = items.filter(it => it.px > -340 && it.px < vw + 340 && visible(it.p));
  const pv = photoItems.filter(it => it.px > -200 && it.px < vw + 200);
  const faded = document.body.classList.contains("filtered");
  ctx.strokeStyle = `rgba(227,38,28,${faded ? .08 : .18})`; ctx.lineWidth = .75;
  for (const p of pv) {
    let best = null, bd = 260;
    for (const q of pv) if (q !== p && q.px > p.px) { const d = Math.hypot(q.px - p.px, q.py - p.py); if (d < bd) { bd = d; best = q; } }
    if (best) thread(ctx, p, best, 0.1);
  }
  ctx.strokeStyle = `rgba(227,38,28,${faded ? .12 : .4})`; ctx.lineWidth = .9;
  for (const p of pv) {
    let best = null, bd = 440;
    for (const q of vis) { const d = Math.hypot(q.px - p.px, q.py - p.py); if (d < bd) { bd = d; best = q; } }

  const done = new Set();
  vis.forEach((a, ia) => {
    vis.map((b, ib) => [ib, Math.hypot(b.px - a.px, b.py - a.py)])
      .filter(([ib, d]) => ib !== ia && d < (faded ? 1400 : 800))
      .sort((x, y) => x[1] - y[1]).slice(0, 2)
      .forEach(([ib]) => {
        const key = Math.min(ia, ib) + "-" + Math.max(ia, ib);

        done.add(key);

      });
  });
}

}

let paused = false, hover = false;
function tick() {

    offset += vel + (hover ? 0 : DRIFT);
    place();
  }
  requestAnimationFrame(tick);
}

/* Une image « pulse » régulièrement pour inviter au clic */
setInterval(() => {
  if (paused || reduce) return;
  const vw = stage.clientWidth;
  const vis = items.filter(it => it.sx > 40 && it.sx + it.w < vw - 40 && visible(it.p));
  if (!vis.length) return;
  const it = vis[Math.floor(Math.random() * vis.length)];
  it.el.classList.remove("pulse"); void it.el.offsetWidth; it.el.classList.add("pulse");
  setTimeout(() => it.el.classList.remove("pulse"), 1700);
}, 2600);

/* Glisser, molette, souris */
let down = false, lastX = 0, moved = 0;
stage.addEventListener("pointerdown", e => { down = true; moved = 0; lastX = e.clientX; vel = 0; });
addEventListener("pointermove", e => {

}, { passive: true });

stage.addEventListener("wheel", e => {

}, { passive: false });
stage.addEventListener("pointerover", e => { hover = !!e.target.closest(".card"); });
stage.addEventListener("pointerleave", () => { hover = false; });

    b.type = "button"; b.textContent = p.titre;
    b.addEventListener("click", () => openFocus(i));
    const c = document.createElement("span"); c.className = "c"; c.textContent = ` [${p.cat[lang]}]`;
    lead.append(b, c, i < PROJETS.length - 1 ? ", " : ".");
  });
  const grid = document.createElement("div");
  grid.className = "grid";
  PROJETS.forEach((p, i) => {
    const b = document.createElement("button");
    b.type = "button";
    if (!visible(p)) b.className = "dim";
    b.setAttribute("aria-label", `${p.titre}, ${p.cat[lang]}`);
    const img = new Image(); img.src = p.image; img.alt = ""; img.loading = "lazy";
    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = `${pad(i + 1)} ${p.titre} [${p.cat[lang]}]`;
    b.append(img, tag);
    b.addEventListener("click", () => openFocus(i));
    grid.append(b);
  });
  const h = document.createElement("h3"); h.textContent = t("photosTitle");
  const pg = document.createElement("div"); pg.className = "grid photos";
  PHOTOS.forEach(src => {
    const b = document.createElement("button"); b.type = "button";
    const img = new Image(); img.src = src; img.alt = ""; img.loading = "lazy";
    b.append(img);
    b.addEventListener("click", () => zoom("img", src, PHOTOS));
    pg.append(b);
  });
  indexEl.replaceChildren(lead, grid, h, pg);
}
function setView(v) {
  indexEl.hidden = v !== "index";
  document.body.classList.toggle("indexview", v === "index");
  $("navField").setAttribute("aria-pressed", String(v === "field"));
  $("navIndex").setAttribute("aria-pressed", String(v === "index"));
  if (v === "index") { hideIntro(); paused = true; } else if (current < 0) paused = false;
}
$("navField").addEventListener("click", () => { closeAbout(); setView("field"); });
$("navIndex").addEventListener("click", () => { closeAbout(); setView("index"); });

/* ═══════════════ Fiche projet ═══════════════ */
const focusEl = $("focus");
let current = -1, lastFocus = null;

function pillButton(label, onClick, solid) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "pill big" + (solid ? " solid" : "");
  b.innerHTML = `<span></span><span aria-hidden="true">→</span>`;
  b.firstChild.textContent = label;
  b.addEventListener("click", onClick);
  return b;
}
function linkPill(p) {
  const a = document.createElement("a");
  a.className = "pill big solid"; a.href = p.lien;
  if (!EXPO) { a.target = "_blank"; a.rel = "noopener"; }
  a.innerHTML = `<span></span><span aria-hidden="true">↗</span>`;
  a.firstChild.textContent = t("open");
  return a;
}
function fill(i) {
  const p = PROJETS[i];
  focusEl.style.setProperty("--c", p.couleur);
  const big = $("big");
  big.replaceChildren(thumb(p, 900));
  big.onclick = null; big.onkeydown = null;
  if (p.type === "lien") {
    big.href = p.lien; big.removeAttribute("role"); big.removeAttribute("tabindex");
    if (EXPO) big.removeAttribute("target"); else { big.target = "_blank"; big.rel = "noopener"; }
    big.setAttribute("aria-label", `${t("open")} : ${p.titre}`);
  } else {
    const go = () => p.galerie ? zoom("img", p.galerie[0], p.galerie) : zoom("img", p.image);
    big.removeAttribute("href"); big.removeAttribute("target");
    big.setAttribute("role", "button"); big.tabIndex = 0;
    big.setAttribute("aria-label", `${p.galerie ? t("photos") : t("poster")} : ${p.titre}`);
    big.onclick = go;
    big.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
  }
  $("fKind").textContent = `${pad(i + 1)} [${p.cat[lang]}]`;
  $("fTitle").textContent = p.titre;
  $("fDesc").textContent = p.desc[lang];
  $("fTags").replaceChildren(...(p.tags || []).map(x => { const s = document.createElement("span"); s.className = "pill"; s.textContent = x; return s; }));
  const acts = [];
  if (p.type === "lien") acts.push(linkPill(p));
  else if (p.type === "galerie") acts.push(pillButton(t("photos"), () => zoom("img", p.galerie[0], p.galerie), true));
  else acts.push(pillButton(t("poster"), () => zoom("img", p.image), true));
  if (p.video) acts.push(pillButton(t("teaser"), () => zoom("video", p.video)));
  $("fActions").replaceChildren(...acts);
  const list = p.galerie || p.process || [];
  $("fProcess").replaceChildren(...list.map(src => {
    const b = document.createElement("button"); b.type = "button";
    const img = new Image(); img.src = src; img.alt = ""; img.loading = "lazy"; b.append(img);
    b.addEventListener("click", () => zoom("img", src, list));
    return b;
  }));
  $("fScan").textContent = t("scanProject");
  qr($("projQr"), projectUrl(p), 144);
  $("fCount").textContent = `${pad(i + 1)} / ${pad(PROJETS.length)}`;
}
function openFocus(i, quiet, fromEl) {
  if (current < 0) lastFocus = document.activeElement;
  hideIntro();
  current = i;
  fill(i);
  if (fromEl && !reduce) fly(fromEl);
  paused = true;
  focusEl.classList.add("on");
  focusEl.setAttribute("aria-hidden", "false");
  stage.inert = true; indexEl.inert = true;
  if (!quiet) setTimeout(() => $("fActions").firstChild?.focus({ preventScroll: true }), reduce ? 0 : 650);
}
function fly(fromEl) {
  const big = $("big");
  const r0 = fromEl.getBoundingClientRect();
  focusEl.classList.add("flip");
  const r1 = big.getBoundingClientRect();
  const c = fromEl.cloneNode(true);
  c.querySelector(".over")?.remove();
  c.classList.add("flyer");
  Object.assign(c.style, { left: r0.left + "px", top: r0.top + "px", width: r0.width + "px" });
  document.body.append(c);
  const k = r1.width / r0.width;
  const a = c.animate([
    { transform: "translate(0, 0) scale(1)" },
    { transform: `translate(${r1.left - r0.left}px, ${r1.top - r0.top}px) scale(${k})` },
  ], { duration: 850, easing: "cubic-bezier(.7,0,.2,1)", fill: "forwards" });
  a.onfinish = () => { focusEl.classList.remove("flip"); requestAnimationFrame(() => c.remove()); };
}
function closeFocus() {
  if (current < 0) return;
  focusEl.classList.remove("on");
  focusEl.setAttribute("aria-hidden", "true");
  stage.inert = false; indexEl.inert = false;
  paused = !indexEl.hidden;
  current = -1;
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}
function shift(d) {
  if (current < 0) return;
  current = mod(current + d, PROJETS.length);
  fill(current);
}

/* ═══════════════ Agrandissement (affiches, teaser, photos) ═══════════════ */
const zoomEl = $("zoom");
let zoomList = null, zoomAt = 0;
function zoom(kind, src, list) {
  const body = $("zoomBody");
  zoomList = list || null;
  zoomAt = list ? list.indexOf(src) : 0;
  $("zoomCount").textContent = list ? `${pad(zoomAt + 1)} / ${pad(list.length)}` : "";
  if (kind === "video") {
    const v = document.createElement("video");
    v.src = src; v.controls = true; v.autoplay = true; v.playsInline = true;
    v.addEventListener("click", e => e.stopPropagation());
    body.replaceChildren(v);
  } else {
    const img = new Image(); img.src = src; img.alt = "";
    if (list) { img.className = "nav"; img.addEventListener("click", e => { e.stopPropagation(); zoomShift(1); }); }
    body.replaceChildren(img);
  }
  zoomEl.hidden = false;
  $("zoomClose").focus({ preventScroll: true });
}
function zoomShift(d) {
  if (!zoomList) return;
  zoomAt = mod(zoomAt + d, zoomList.length);
  zoom("img", zoomList[zoomAt], zoomList);
}
function unzoom() {
  if (zoomEl.hidden) return false;
  zoomEl.hidden = true;
  $("zoomBody").replaceChildren();
  return true;
}
zoomEl.addEventListener("click", unzoom);

/* ═══════════════ À propos ═══════════════ */
const aboutEl = $("about");
function openAbout() {
  hideIntro();
  const box = $("portrait");
  if (!box.firstChild) {
    if (PORTRAIT) { const img = new Image(); img.src = PORTRAIT; img.alt = "Léa Tramati"; box.append(img); }
    else box.textContent = "LT";
  }
  const c = $("contact");
  if (CONTACT) { const a = document.createElement("a"); a.href = CONTACT.href; a.target = "_blank"; a.rel = "noopener"; a.textContent = CONTACT.label; c.replaceChildren(a); }
  else c.textContent = t("noContact");
  aboutEl.hidden = false;
  $("navAbout").setAttribute("aria-pressed", "true");
  $("aboutClose").focus({ preventScroll: true });
}
function closeAbout() {
  if (aboutEl.hidden) return false;
  aboutEl.hidden = true;
  $("navAbout").setAttribute("aria-pressed", "false");
  return true;
}
$("navAbout").addEventListener("click", () => aboutEl.hidden ? openAbout() : closeAbout());
$("aboutClose").addEventListener("click", closeAbout);
aboutEl.addEventListener("click", e => { if (e.target === aboutEl) closeAbout(); });

/* ═══════════════ Démo automatique (mode expo) ═══════════════ */
let idleTimer = null, demoTimer = null, demoOn = false, demoIndex = -1;
function startDemo() {
  demoOn = true;
  $("demo").hidden = false;
  demoIndex = -1;
  unzoom(); closeAbout(); closeFocus(); setView("field"); filtre = "all"; renderFilters(); applyFilter();
  showIntro();
  demoTimer = setTimeout(demoStep, 7000);
}
function demoStep() {
  unzoom(); hideIntro();
  demoIndex = (demoIndex + 1) % PROJETS.length;
  if (current >= 0) {
    closeFocus();
    demoTimer = setTimeout(() => { openFocus(demoIndex, true); demoTimer = setTimeout(demoStep, DEMO_STEP_SECONDS * 1000); }, reduce ? 300 : 1300);
  } else {
    openFocus(demoIndex, true);
    demoTimer = setTimeout(demoStep, DEMO_STEP_SECONDS * 1000);
  }
}
function stopDemo() {
  clearTimeout(demoTimer);
  demoOn = false;
  $("demo").hidden = true;
  closeFocus(); hideIntro();
}
function activity(e) {
  if (demoOn) { stopDemo(); if (e && e.cancelable) { e.preventDefault(); e.stopPropagation(); } }
  if (!EXPO) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(startDemo, IDLE_SECONDS * 1000);
}
if (EXPO) {
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(ev => addEventListener(ev, activity, { capture: true, passive: false }));
  activity();
}

/* ═══════════════ Langue, plein écran, clavier ═══════════════ */
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  stage.setAttribute("aria-label", t("stage"));
  $("hint").innerHTML = t("hint");
  $("close").textContent = t("close");
  $("zoomClose").textContent = t("close");
  $("aboutClose").textContent = t("close");
  $("prev").setAttribute("aria-label", t("prev"));
  $("next").setAttribute("aria-label", t("next"));
  $("full").setAttribute("aria-label", t("full")); $("full").title = t("full");
  if (!aboutEl.hidden) openAbout();
  renderIntro(); renderFilters(); renderIndex(); build();
  if (current >= 0) fill(current);
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("lang", lang); } catch {}
  applyLang();
}));
$("full").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  else document.documentElement.requestFullscreen?.().catch(() => {});
});
if (!document.fullscreenEnabled) $("full").hidden = true;
$("close").addEventListener("click", closeFocus);
$("prev").addEventListener("click", () => shift(-1));
$("next").addEventListener("click", () => shift(1));
$("zoomClose").addEventListener("click", unzoom);

addEventListener("keydown", e => {
  if (e.key === "Escape" && (unzoom() || closeAbout())) return;
  if (!zoomEl.hidden) { if (e.key === "ArrowRight") zoomShift(1); if (e.key === "ArrowLeft") zoomShift(-1); return; }
  if (current >= 0) {
    if (e.key === "Escape") closeFocus();
    if (e.key === "ArrowRight") shift(1);
    if (e.key === "ArrowLeft") shift(-1);
    return;
  }
  if (e.key === "ArrowRight") vel += 6;
  if (e.key === "ArrowLeft") vel -= 6;
});

/* ═══════════════ Démarrage ═══════════════ */
qr($("siteQr"), SITE_URL, 128);
setView("field");
applyLang();
if (!location.hash || EXPO) { showIntro(); setTimeout(() => { if (!demoOn) hideIntro(); }, 7000); }
let rs;
addEventListener("resize", () => { clearTimeout(rs); rs = setTimeout(build, 150); });
requestAnimationFrame(tick);
const deep = PROJETS.findIndex(p => "#" + p.id === location.hash);
if (deep >= 0) openFocus(deep);
if (location.hash === "#index") setView("index");
</script>
