<style>
/* Champ blanc d'images, étiquettes cerclées d'un filet. Un seul thème, volontairement. Contrastes AA. */
:root {
  --paper: #FFFFFF;
  --ink: #111111;
  --soft: #5E5E5E;
  --focus: #1F4BFF;
  --sans: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --gx: 16px;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--paper); color: var(--ink);
  font: 400 15px/1.35 var(--sans);
  text-transform: uppercase; letter-spacing: .02em;
}
body.nocursor, body.nocursor * { cursor: none !important; }
img { max-width: 100%; }
button { font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: fixed; left: 12px; top: -60px; z-index: 100; background: var(--ink); color: var(--paper); padding: 10px 14px; text-decoration: none; }
.skip:focus { top: 12px; }

/* L'étiquette encadrée : le motif de tout le site */
.box {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--ink); background: var(--paper); color: var(--ink);
  padding: 6px 10px 5px; min-height: 34px;
  text-decoration: none; white-space: nowrap;
}
button.box, a.box { cursor: pointer; }
button.box:hover, a.box:hover, .box[aria-pressed="true"], .box.solid { background: var(--ink); color: var(--paper); }
.box.solid:hover { background: var(--paper); color: var(--ink); }
.box.big { font-size: 16px; padding: 10px 14px 9px; min-height: 44px; }
.caret::after { content: ""; display: inline-block; width: .55em; height: 1em; margin-left: 2px; background: currentColor; vertical-align: -2px; animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
body.still .caret::after { animation: none; opacity: 0; }

/* ---------- Barres ---------- */
.bar { position: fixed; left: 0; right: 0; z-index: 30; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding-inline: var(--gx); pointer-events: none; }
.bar > * { pointer-events: auto; }
#top { top: 0; padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
.who { display: flex; gap: 8px; align-items: center; }
.who img { width: 34px; height: 34px; display: block; background: var(--paper); }
.tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.langs { display: inline-flex; border: 1px solid var(--ink); background: var(--paper); }
.langs button { background: none; border: 0; padding: 6px 9px 5px; min-height: 32px; cursor: pointer; color: var(--soft); }
.langs button + button { border-left: 1px solid var(--ink); }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.langs button:hover { color: var(--ink); }
.langs button[aria-pressed="true"]:hover { color: var(--paper); }

#bottom { bottom: 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); align-items: flex-end; }
#list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; max-width: min(1000px, 78vw); }
#list .box .n { color: var(--soft); }
#list .box:hover .n, #list .box:focus-visible .n, #list .box[aria-current="true"] .n { color: inherit; }
#list .box[aria-current="true"] { background: var(--ink); color: var(--paper); }
.qr { display: flex; align-items: flex-end; gap: 8px; }
.qr .box { white-space: normal; max-width: 15ch; font-size: 12px; line-height: 1.25; }
.code { background: #fff; line-height: 0; border: 1px solid var(--ink); padding: 4px; }
.code canvas, .code img { display: block; width: 64px; height: 64px; }

/* ---------- Le champ d'images ---------- */
#field { position: fixed; inset: 0; z-index: 0; overflow: hidden; touch-action: none; }
.tile { position: absolute; left: 0; top: 0; will-change: transform; transition: opacity .35s; }
.tile img { display: block; width: 100%; height: auto; }
.tile.ph { pointer-events: none; }
.tile.pj { cursor: pointer; z-index: 2; }
.tile.pj img { box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
body.spot .tile { opacity: .14; }
body.spot .tile.on { opacity: 1; z-index: 3; }
body.filtering .tile.ph { opacity: .3; }

/* Étiquette centrale, tapée lettre par lettre */
#center { position: fixed; z-index: 20; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; display: grid; gap: 8px; justify-items: center; max-width: calc(100vw - 32px); }
#label { font-size: clamp(16px, 2vw, 26px); padding: 8px 14px 7px; white-space: normal; text-align: center; }
#sub { font-size: 13px; color: var(--soft); background: var(--paper); padding: 2px 6px; text-align: center; }

/* ---------- Fiche projet ---------- */
#focus { position: fixed; inset: 0; z-index: 40; background: var(--paper); overflow-y: auto; opacity: 0; visibility: hidden; transition: opacity .3s, visibility 0s .3s; }
#focus.on { opacity: 1; visibility: visible; transition: opacity .3s; }
.fbar { position: sticky; top: 0; z-index: 3; background: var(--paper); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: calc(14px + env(safe-area-inset-top, 0px)) var(--gx) 12px; }
.fbar .count { padding-inline: 8px; color: var(--soft); }
.fbar #close { margin-left: auto; }
.sheet { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 48px; align-items: center; padding: 24px var(--gx) 60px; min-height: calc(100vh - 70px); }
/* La pile d'images */
.stack { position: relative; justify-self: stretch; display: grid; place-items: center; padding: 6% 4%; }
.stack .under { position: absolute; width: 46%; max-height: 60%; object-fit: cover; box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
.stack .under:nth-child(1) { left: 0; top: 0; }
.stack .under:nth-child(2) { right: 0; bottom: 0; }
.big { position: relative; z-index: 2; display: block; line-height: 0; cursor: pointer; }
.big img { display: block; max-width: min(100%, 640px); max-height: 64vh; width: auto; height: auto; box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
#focus.on .stack .under, #focus.on .big { animation: drop .55s cubic-bezier(.2,.8,.2,1) both; }
#focus.on .stack .under:nth-child(2) { animation-delay: .07s; }
#focus.on .big { animation-delay: .14s; }
@keyframes drop { from { opacity: 0; translate: 0 26px; } }
body.still #focus.on .stack .under, body.still #focus.on .big { animation: none; }
.info { display: grid; gap: 16px; justify-items: start; }
.info .k { color: var(--soft); }
.info h2 { margin: 0; font: 500 clamp(30px, 4vw, 58px)/1 var(--sans); letter-spacing: -.01em; }
.info p { margin: 0; text-transform: none; letter-spacing: 0; font-size: 17px; line-height: 1.55; max-width: 44ch; }
.tags { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.tags li { border: 1px solid var(--soft); color: var(--soft); padding: 3px 8px 2px; font-size: 13px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.process { list-style: none; margin: 0; padding: 2px; display: flex; flex-wrap: wrap; gap: 4px; max-height: 160px; overflow-y: auto; }
.process:empty { display: none; }
.process button { padding: 0; border: 0; cursor: zoom-in; line-height: 0; }
.process img { width: 54px; height: 54px; object-fit: cover; }
.pqr { display: flex; align-items: center; gap: 10px; color: var(--soft); font-size: 12px; }
.pqr .code canvas, .pqr .code img { width: 66px; height: 66px; }

/* ---------- Agrandissement ---------- */
#zoom { position: fixed; inset: 0; z-index: 50; background: rgba(255,255,255,.98); display: grid; place-items: center; padding: 70px 80px; }
#zoom figure { margin: 0; display: grid; gap: 10px; justify-items: center; }
#zoom img, #zoom video { max-width: 100%; max-height: calc(100vh - 170px); display: block; }
#zoom video { background: #000; }
#zoomClose { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: var(--gx); }
.zarrow { position: absolute; top: 50%; transform: translateY(-50%); }
#zoomPrev { left: var(--gx); }
#zoomNext { right: var(--gx); }

/* ---------- Info ---------- */
#about { position: fixed; inset: 0; z-index: 55; display: flex; justify-content: flex-end; background: rgba(255,255,255,.6); }
#about .panel { width: min(520px, 100%); height: 100%; overflow-y: auto; background: var(--paper); border-left: 1px solid var(--ink); padding: calc(14px + env(safe-area-inset-top, 0px)) 24px 28px; display: grid; align-content: start; gap: 22px; }
#about .top { display: flex; justify-content: flex-end; }
#about .portrait { width: 46%; aspect-ratio: 4 / 5; border: 1px solid var(--ink); display: grid; place-items: center; overflow: hidden; }
#about .portrait img { width: 60%; }
#about .portrait img.real { width: 100%; height: 100%; object-fit: cover; }
#about h2 { margin: 0; font: 500 36px/1 var(--sans); }
#about p { margin: 0; text-transform: none; letter-spacing: 0; font-size: 16px; line-height: 1.6; }
#about dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14px; }
#about dt { color: var(--soft); }
#about dd { margin: 0; overflow-wrap: anywhere; }

/* ---------- Bande-démo (mode expo) ---------- */
#reel { position: fixed; inset: 0; z-index: 70; background: var(--paper); overflow: hidden; cursor: pointer; }
.slide { position: absolute; inset: 0; display: grid; place-items: center; padding: 8vh 8vw 20vh; opacity: 0; transition: opacity .7s ease; }
.slide.in { opacity: 1; }
.slide .under { position: absolute; width: 22vw; max-width: 340px; opacity: .9; }
.slide img.main, .slide video.main { position: relative; z-index: 2; display: block; max-width: 70vw; max-height: 62vh; width: auto; height: auto; }
.r-label { position: absolute; z-index: 3; left: 50%; bottom: 8vh; transform: translateX(-50%); font-size: clamp(18px, 2.4vw, 34px); padding: 10px 16px 9px; white-space: nowrap; }
.r-cta { position: absolute; z-index: 3; top: 4vh; right: var(--gx); }
.r-cta::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #E3261C; animation: caret 1.2s steps(1) infinite; }
.r-bar { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: 3px; background: #EEE; }
.r-bar span { display: block; height: 100%; width: 0; background: var(--ink); }

@media (max-width: 760px) {
  body { font-size: 14px; }
  #list { max-width: 100%; }
  .qr { display: none; }
  .sheet { grid-template-columns: 1fr; gap: 24px; }
  .big img { max-height: 44vh; }
  .pqr { display: none; }
  #zoom { padding: 70px 12px 100px; }
  .zarrow { top: auto; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: none; }
}
</style>

function rng(seed) {

}
function qr(el, text, size, label) {

/* Texte tapé lettre par lettre */
const typing = new WeakMap();
function type(el, text) {
  clearInterval(typing.get(el));
  if (still) { el.textContent = text; return; }
  let k = 0;
  el.textContent = "";
  typing.set(el, setInterval(() => {
    k += 1;
    el.textContent = text.slice(0, k);
    if (k >= text.length) clearInterval(typing.get(el));
  }, 32));
}

/* ═══════════════ Le champ d'images ═══════════════ */
const field = $("field");
let tiles = [], cw = 150, ch = 150, cols = 0, rows = 0, offY = 0, vel = 0, hoverField = false;
let spot = -1;   /* projet mis en avant (survol, clavier) */

function build() {
  const vw = innerWidth, vh = innerHeight;
  const small = vw < 640;
  cw = small ? 110 : 168; ch = small ? 120 : 150;
  cols = Math.ceil(vw / cw) + 1;
  rows = Math.ceil(vh / ch) + 2;
  /* Une case sur deux (en damier) reçoit un projet, à tour de rôle : les 8 projets apparaissent toujours, quelle que soit la largeur de l'écran. Pas de photos décoratives. */
  let pk = 0;
  const r = rng("champ");
  field.replaceChildren();
  tiles = [];
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    if (mod(x + y, 2) !== 0) continue;
    const it = { p: pk++ % N };
    const el = document.createElement("div");
    let w;
    if (it.p !== undefined) {
      const p = PROJETS[it.p];
      el.className = "tile pj";
      const ratio = RATIOS[p.format] || 4 / 3;
      w = Math.round(cw * (ratio < 0.8 ? 0.42 : 0.6));
      el.append(pimg(p));
      el.dataset.p = it.p;
      el.addEventListener("click", () => openFocus(+el.dataset.p, false, el.firstChild));
      el.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") setSpot(+el.dataset.p); });
      el.addEventListener("pointerleave", () => setSpot(-1));
    } else {
      el.className = "tile ph";
      w = Math.round(cw * (0.26 + r() * 0.14));
      const im = new Image(); im.src = it.ph; im.alt = ""; im.decoding = "async"; im.loading = "lazy"; im.draggable = false;
      el.append(im);
    }
    el.style.width = w + "px";
    field.append(el);
    tiles.push({ el, x: x * cw + (r() - 0.3) * cw * 0.35, y: y * ch + (r() - 0.3) * ch * 0.3, p: it.p });
  }
  markSpot();
  place();
}
function place() {
  const H = rows * ch;
  for (const t of tiles) {
    const y = mod(t.y - offY, H) - ch;
    t.el.style.transform = `translate3d(${t.x.toFixed(1)}px, ${y.toFixed(1)}px, 0)`;
  }
}
let paused = false;
function tick() {
  if (!paused) {
    vel *= 0.92;
    offY += vel + (still || hoverField || spot >= 0 ? 0 : 0.25);
    place();
  }
  requestAnimationFrame(tick);
}
field.addEventListener("pointerenter", () => { hoverField = true; });
field.addEventListener("pointerleave", () => { hoverField = false; });
addEventListener("wheel", e => { if (topDialog()) return; vel += e.deltaY * 0.05; }, { passive: true });
let dragY = null;
field.addEventListener("pointerdown", e => { dragY = e.clientY; });
addEventListener("pointermove", e => { if (dragY === null) return; offY -= e.clientY - dragY; dragY = e.clientY; }, { passive: true });
addEventListener("pointerup", () => { dragY = null; });

/* Mise en avant d'un projet : ses vignettes restent, le reste s'efface, l'étiquette se retape */
function setSpot(i) {
  if (spot === i) return;
  spot = i;
  markSpot();
  const p = PROJETS[i];
  type($("label"), p ? `${pad3(i + 1)} — ${p.titre}` : "Léa Tramati");
  $("sub").textContent = p ? p.cat[lang] : t("tagline");
}
function markSpot() {
  document.body.classList.toggle("spot", spot >= 0);
  tiles.forEach(t => t.el.classList.toggle("on", t.p === spot));
  document.querySelectorAll("#list .box").forEach((b, i) => b.setAttribute("aria-current", String(i === spot)));
}

/* ═══════════════ Liste des projets (en bas) : le moyen accessible d'ouvrir un projet ═══════════════ */
function renderList() {
  $("listTitle").textContent = t("list");
  $("list").replaceChildren(...PROJETS.map((p, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "box"; b.type = "button"; b.id = "item-" + p.id;
    b.setAttribute("aria-label", T[lang].listItem(i + 1, N, p));
    b.innerHTML = '<span class="n"></span><span></span>';
    b.children[0].textContent = pad3(i + 1); b.children[1].textContent = p.titre;
    b.addEventListener("click", () => {
      const tile = tiles.find(x => x.p === i && x.el.getBoundingClientRect().top > 60 && x.el.getBoundingClientRect().bottom < innerHeight - 60);
      openFocus(i, false, tile?.el.firstChild);
    });
    b.addEventListener("pointerenter", () => setSpot(i));
    b.addEventListener("pointerleave", () => setSpot(-1));
    b.addEventListener("focus", () => setSpot(i));
    b.addEventListener("blur", () => setSpot(-1));
    li.append(b);
    return li;
  }));
}
/* Flèches du clavier dans la liste */
$("list").addEventListener("keydown", e => {
  const btns = [...document.querySelectorAll("#list .box")];
  const at = btns.indexOf(document.activeElement);
  if (at < 0) return;
  const moves = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
  if (e.key in moves) { e.preventDefault(); btns[mod(at + moves[e.key], btns.length)].focus(); }
  if (e.key === "Home") { e.preventDefault(); btns[0].focus(); }
  if (e.key === "End") { e.preventDefault(); btns[btns.length - 1].focus(); }
});

/* ═══════════════ Fenêtres : focus piégé, fond inerte ═══════════════ */
const focusEl = $("focus"), zoomEl = $("zoom"), aboutEl = $("about");
const outside = () => [$("top"), $("bottom"), $("skip")];
function topDialog() {
  if (!zoomEl.hidden) return zoomEl;
  if (!aboutEl.hidden) return aboutEl;
  if (focusEl.classList.contains("on")) return focusEl;
  return null;
}
function syncInert() {
  const d = topDialog();
  outside().forEach(el => { el.inert = !!d; });
  focusEl.inert = !!d && d !== focusEl;
  paused = !!d || demoOn;
}
addEventListener("keydown", e => {
  if (e.key !== "Tab") return;
  const d = topDialog();
  if (!d) return;
  const f = [...d.querySelectorAll('a[href], button:not([disabled]), video[controls], [tabindex="0"]')].filter(x => x.getClientRects().length);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }

});

let current = -1, focusReturn = null;

function extraImages(p) {

function fill(i) {

  else if (p.type === "videos") acts.push(btn(t("videos"), mainAction(p), true));

}
function openFocus(i, quiet) {
  if (current < 0) focusReturn = document.activeElement;
  current = i;
  fill(i);
  focusEl.classList.add("on");
  focusEl.setAttribute("aria-hidden", "false");
  syncInert();
  if (!quiet) setTimeout(() => $("fActions").firstChild?.focus({ preventScroll: true }), still ? 0 : 350);
}
function closeFocus() {
  if (current < 0) return;
  focusEl.classList.remove("on");
  focusEl.setAttribute("aria-hidden", "true");
  const back = document.getElementById("item-" + PROJETS[current].id);
  current = -1;
  syncInert();
  setSpot(-1);
  (focusReturn && document.contains(focusReturn) && focusReturn.matches("#list .box") ? focusReturn : back)?.focus({ preventScroll: true });
}
function shift(d) {
  if (current < 0) return;
  current = mod(current + d, N);
  fill(current);
  announce(T[lang].now(current + 1, N, PROJETS[current]));
}

/* ═══════════════ Agrandissement ═══════════════ */
let zoomList = [], zoomAt = 0, zoomProject = null, zoomReturn = null;
function zoom(list, at, p) {
  if (zoomEl.hidden) zoomReturn = document.activeElement;
  zoomList = list; zoomAt = at; zoomProject = p;
  const src = list[at];
  const many = list.length > 1;
  $("zoomPrev").hidden = $("zoomNext").hidden = !many;
  let cap;
  if (isVideo(src)) {
    const v = document.createElement("video");
    v.src = src; v.controls = true; v.playsInline = true; v.autoplay = !still;
    cap = p.videoTitles && p.videos?.includes(src) ? T[lang].videoOf(at + 1, list.length, p.videoTitles[at]) : p.titre;
    v.setAttribute("aria-label", cap);
    if (many) v.addEventListener("ended", () => zoomShift(1));
    $("zoomBody").replaceChildren(v);
  } else {
    const im = new Image(); im.src = src;
    if (p.galerie) { cap = T[lang].photoOf(at + 1, list.length); im.alt = cap; }
    else { cap = p.titre; im.alt = p.alt[lang]; }
    $("zoomBody").replaceChildren(im);
  }
  $("zoomCap").textContent = cap;
  zoomEl.hidden = false;
  syncInert();
  $("zoomClose").focus({ preventScroll: true });
  if (many) announce(cap);
}
function zoomShift(d) { if (zoomList.length > 1) zoom(zoomList, mod(zoomAt + d, zoomList.length), zoomProject); }
function unzoom() {
  if (zoomEl.hidden) return false;
  zoomEl.hidden = true;
  $("zoomBody").replaceChildren();
  syncInert();
  zoomReturn?.focus?.({ preventScroll: true });
  return true;
}
zoomEl.addEventListener("click", e => { if (e.target === zoomEl) unzoom(); });
$("zoomClose").addEventListener("click", unzoom);
$("zoomPrev").addEventListener("click", () => zoomShift(-1));
$("zoomNext").addEventListener("click", () => zoomShift(1));

/* ═══════════════ Info ═══════════════ */
let aboutReturn = null;
function openAbout() {
  if (aboutEl.hidden) aboutReturn = document.activeElement;
  const im = new Image();
  if (PORTRAIT) { im.src = PORTRAIT; im.alt = "Léa Tramati"; im.className = "real"; } else { im.src = "vignettes/logo.png"; im.alt = "Logo LT"; }
  $("portrait").replaceChildren(im);
  const c = $("contact");
  if (CONTACT) { const a = document.createElement("a"); a.href = CONTACT.href; a.target = "_blank"; a.rel = "noopener"; a.textContent = CONTACT.label; c.replaceChildren(a); }
  else c.textContent = t("noContact");
  aboutEl.hidden = false;
  $("navAbout").setAttribute("aria-pressed", "true");
  syncInert();
  $("aboutClose").focus({ preventScroll: true });
}
function closeAbout() {
  if (aboutEl.hidden) return false;
  aboutEl.hidden = true;
  $("navAbout").setAttribute("aria-pressed", "false");
  syncInert();
  aboutReturn?.focus?.({ preventScroll: true });
  return true;
}
$("navAbout").addEventListener("click", openAbout);
$("aboutClose").addEventListener("click", closeAbout);
aboutEl.addEventListener("click", e => { if (e.target === aboutEl) closeAbout(); });

/* ═══════════════ Pause ═══════════════ */
function applyStill() {
  document.body.classList.toggle("still", still);
  $("pause").setAttribute("aria-pressed", String(still));
  $("pause").textContent = still ? t("play") : t("pause");
  $("pause").setAttribute("aria-label", still ? t("playLabel") : t("pauseLabel"));
}
$("pause").addEventListener("click", () => {
  still = !still;
  try { localStorage.setItem("still", still ? "1" : "0"); } catch {}
  applyStill();
});

/* ═══════════════ Bande-démo (mode expo) ═══════════════ */
let idleTimer = null, demoTimer = null, demoOn = false, demoIndex = -1;
const reelEl = $("reel");
function demoStep() {
  demoIndex = (demoIndex + 1) % N;
  const p = PROJETS[demoIndex];
  const st = $("reelStage");
  const slide = document.createElement("div");
  slide.className = "slide";
  const r = rng("reel" + demoIndex);
  extraImages(p).concat(PROJETS.filter((_, j) => j !== demoIndex).slice(0, 3).map(q => q.image)).forEach(src => {
    const u = new Image(); u.src = src; u.alt = ""; u.className = "under";
    u.style.left = (8 + r() * 70) + "vw"; u.style.top = (6 + r() * 50) + "vh"; u.style.width = (8 + r() * 8) + "vw";
    slide.append(u);
  });
  const vid = !still && (p.preview || p.video);
  if (vid) { const v = document.createElement("video"); v.className = "main"; v.src = vid; v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true; v.poster = p.image; slide.append(v); v.play().catch(() => {}); }
  else { const im = new Image(); im.className = "main"; im.src = p.image; im.alt = ""; slide.append(im); }
  st.append(slide);
  setTimeout(() => slide.classList.add("in"), 40);
  type($("reelLabel"), `${pad3(demoIndex + 1)} — ${p.titre}`);
  [...st.children].slice(0, -1).forEach(old => { old.classList.remove("in"); setTimeout(() => old.remove(), 800); });
  const bar = $("reelBar");
  bar.getAnimations?.().forEach(x => x.cancel());
  bar.animate?.([{ width: "0%" }, { width: "100%" }], { duration: DEMO_STEP_SECONDS * 1000, easing: "linear", fill: "forwards" });
  demoTimer = setTimeout(demoStep, DEMO_STEP_SECONDS * 1000);
}
function startDemo() {
  if (demoOn) return;
  demoOn = true;
  unzoom(); closeAbout(); closeFocus();
  demoIndex = -1;
  $("reelCta").textContent = t("demo");
  $("reelStage").replaceChildren();
  reelEl.hidden = false;
  syncInert();
  demoStep();
}
function stopDemo() {
  clearTimeout(demoTimer);
  demoOn = false;
  reelEl.hidden = true;
  $("reelStage").replaceChildren();
  syncInert();
}
function activity(e) {
  if (demoOn) { stopDemo(); if (e && e.cancelable) { e.preventDefault(); e.stopPropagation(); } }
  if (!EXPO) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(startDemo, IDLE_SECONDS * 1000);
}
if (EXPO) {
  let cur;
  addEventListener("pointermove", () => { document.body.classList.remove("nocursor"); clearTimeout(cur); cur = setTimeout(() => document.body.classList.add("nocursor"), 3000); }, { passive: true });
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(ev => addEventListener(ev, activity, { capture: true, passive: false }));
  activity();
}

/* ═══════════════ Langue, plein écran, clavier ═══════════════ */
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("langs").setAttribute("aria-label", t("langs"));
  $("skip").textContent = t("skip");
  $("navAbout").textContent = t("info");
  $("prev").textContent = t("prev"); $("prev").setAttribute("aria-label", t("prevLabel"));
  $("next").textContent = t("next"); $("next").setAttribute("aria-label", t("nextLabel"));
  $("close").textContent = t("close"); $("zoomClose").textContent = t("close"); $("aboutClose").textContent = t("close");
  $("zoomPrev").setAttribute("aria-label", t("prevItem")); $("zoomNext").setAttribute("aria-label", t("nextItem"));
  $("full").setAttribute("aria-label", t("full")); $("full").title = t("full");
  $("name").title = t("context");
  qr($("siteQr"), SITE_URL, 128, t("qrSite"));
  applyStill(); renderList();
  const s = spot; spot = -2; setSpot(s);
  if (current >= 0) fill(current);
  if (!aboutEl.hidden) openAbout();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("lang", lang); } catch {}
  applyLang();
  $("lang-" + lang).focus();
}));
$("full").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  else document.documentElement.requestFullscreen?.().catch(() => {});
});
if (!document.fullscreenEnabled) $("full").hidden = true;
$("close").addEventListener("click", closeFocus);
$("prev").addEventListener("click", () => shift(-1));
$("next").addEventListener("click", () => shift(1));
$("skip").addEventListener("click", e => { e.preventDefault(); document.querySelector("#list .box")?.focus(); });

addEventListener("keydown", e => {
  if (e.key === "Escape") { if (unzoom() || closeAbout()) return; if (current >= 0) { closeFocus(); return; } }
  if (!zoomEl.hidden) {
    if (e.key === "ArrowRight") { e.preventDefault(); zoomShift(1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); zoomShift(-1); }
    return;
  }
  if (current >= 0 && aboutEl.hidden && document.activeElement?.tagName !== "VIDEO") {
    if (e.key === "ArrowRight") shift(1);
    if (e.key === "ArrowLeft") shift(-1);
    return;
  }
  /* Sur l'accueil, une flèche amène directement dans la liste des projets */
  if (!topDialog() && !e.target.closest?.("#list, .langs, nav") && e.key.startsWith("Arrow")) {
    e.preventDefault();
    document.querySelector("#list .box")?.focus();
  }
});

/* ═══════════════ Démarrage ═══════════════ */
applyLang();
build();
let rs;
addEventListener("resize", () => { clearTimeout(rs); rs = setTimeout(build, 150); });
requestAnimationFrame(tick);
const deep = PROJETS.findIndex(p => "#" + p.id === location.hash);
if (deep >= 0) openFocus(deep, true);
</script>
</body>
</html>
