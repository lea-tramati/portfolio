<style>
/* Page blanche, encre noire. Un seul thème, volontairement. Contrastes vérifiés AA. */
:root {
  --paper: #FFFFFF;
  --ink: #111111;
  --soft: #595959;      /* 7:1 sur blanc */
  --red: #C8201A;       /* 5,9:1 sur blanc */
  --focus: #1F4BFF;
  --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "Courier Prime", "Courier New", Courier, monospace;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 16px/1.45 var(--sans);
  overflow: hidden;
}
img { max-width: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; border-radius: 4px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Lien d'évitement */
.skip {
  position: fixed; left: 12px; top: -60px; z-index: 100;
  background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: 6px;
  font: 600 15px/1 var(--sans); text-decoration: none;
}
.skip:focus { top: 12px; }

/* ---------- Pastilles (boutons, étiquettes) ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 34px;
  border: 2px solid var(--ink); border-radius: 99px;
  background: var(--paper); color: var(--ink);
  font: 700 13px/1 var(--sans); text-transform: uppercase; letter-spacing: .01em;
  padding: 7px 12px 6px;
  text-decoration: none; white-space: nowrap; cursor: pointer;
  transition: background .15s, color .15s, gap .2s;
}
.pill:hover, .pill[aria-pressed="true"], .pill.solid { background: var(--ink); color: var(--paper); }
.pill.solid:hover { background: var(--red); border-color: var(--red); }
.pill.big { font-size: 15px; padding: 12px 18px 11px; min-height: 46px; }
.pill.big:hover { gap: 12px; }

/* ---------- Barres haut et bas ---------- */
.bar {
  position: fixed; left: 0; right: 0; z-index: 30;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  padding-inline: 20px;
  pointer-events: none;
}
.bar > * { pointer-events: auto; }
#top { top: 0; padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
#name { font: 500 18px/1.1 var(--sans); letter-spacing: -.01em; justify-self: start; display: flex; align-items: center; gap: 10px; }
#name img { width: 42px; height: 42px; display: block; }
#name small { display: block; font: 400 14px/1.3 var(--mono); color: var(--soft); letter-spacing: 0; }
nav { display: flex; gap: 6px; }
#right { justify-self: end; display: flex; align-items: center; gap: 10px; }
.langs { display: flex; gap: 2px; }
.langs button {
  background: none; border: 0; cursor: pointer; padding: 8px 6px; min-width: 34px; min-height: 34px;
  font: 400 15px/1 var(--mono); color: var(--soft);
}
.langs button:hover, .langs button[aria-pressed="true"] { color: var(--ink); }
.langs button[aria-pressed="true"] { text-decoration: underline; text-underline-offset: 4px; }

#bottom { bottom: 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); align-items: end; }
#hint { font: 400 14px/1.4 var(--mono); color: var(--soft); justify-self: start; max-width: 32ch; margin: 0; }
#hint kbd { font: 700 13px/1 var(--sans); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 4px; padding: 1px 5px; }
#filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px; }
#filters button {
  background: none; border: 0; cursor: pointer; padding: 6px 2px; min-height: 34px;
  font: 400 17px/1 var(--sans); color: var(--soft);
}
#filters button:hover, #filters button[aria-pressed="true"] { color: var(--ink); }
#filters button[aria-pressed="true"] { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
#filters sup { font-size: 11px; margin-left: 1px; }
.qr { justify-self: end; display: flex; align-items: end; gap: 10px; text-align: right; }
.qr span { font: 400 13px/1.3 var(--mono); color: var(--soft); max-width: 16ch; }
.code { background: #fff; line-height: 0; }
.code canvas, .code img { display: block; }
.qr .code canvas, .qr .code img { width: 62px; height: 62px; }

/* ---------- Carrousel ---------- */
#stage {
  position: relative; z-index: 0; isolation: isolate;
  height: 100%; overflow: hidden;
  cursor: grab; touch-action: pan-y;
}
#stage.dragging { cursor: grabbing; }

.card {
  position: absolute; left: 0; top: 0; z-index: 10;
  display: grid; gap: 8px; justify-items: start;
  padding: 0; border: 0; background: none; text-align: left;
  cursor: pointer; will-change: transform;
  transition: opacity .4s;
}
.shot { position: relative; display: block; width: 100%; background: #F3F3F1; box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 14px 34px rgba(0,0,0,.12); }
.shot img, .shot video { display: block; width: 100%; height: auto; aspect-ratio: var(--r); object-fit: cover; object-position: top; }
.shot .over {
  position: absolute; inset: 0; display: grid; place-items: center;
  font: 800 17px/1.1 var(--sans); color: #fff; text-transform: uppercase; text-align: center;
  background: rgba(17,17,17,.45); opacity: 0; transition: opacity .2s;
}
.card:hover .over, .card:focus-visible .over { opacity: 1; }
.card:focus-visible { outline: none; }
.card:focus-visible .shot, .card.sel .shot { outline: 4px solid var(--focus); outline-offset: 5px; }
.cap { font: 400 15px/1.3 var(--mono); color: var(--ink); }
.cap .n { color: var(--red); font-weight: 700; }
.cap .c { color: var(--soft); }
.card .pill { pointer-events: none; }
.card:hover .pill, .card:focus-visible .pill { background: var(--ink); color: var(--paper); }
.card.dim { opacity: .1; }
.card.pulse .shot { animation: pulse 1.6s ease-out; }
@keyframes pulse { from { box-shadow: 0 0 0 0 rgba(17,17,17,.45); } to { box-shadow: 0 0 0 18px rgba(17,17,17,0); } }

.photo {
  position: absolute; left: 0; top: 0; z-index: 1;
  pointer-events: none; will-change: transform;
  opacity: .5; transition: opacity .5s;
}
.photo img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; filter: grayscale(.4); }
body.intro .photo, body.filtered .photo { opacity: .15; }
body.intro .card { opacity: .25; }

/* Flèches de navigation à l'écran */
.arrow {
  position: fixed; top: 50%; z-index: 25; transform: translateY(-50%);
  width: 56px; height: 56px; border-radius: 50%;
  border: 2px solid var(--ink); background: var(--paper); color: var(--ink);
  font: 700 24px/1 var(--sans); cursor: pointer;
  display: grid; place-items: center;
  box-shadow: 0 6px 20px rgba(0,0,0,.12);
}
.arrow:hover { background: var(--ink); color: var(--paper); }
#goPrev { left: 16px; }
#goNext { right: 16px; }

/* ---------- Accueil ---------- */
#intro {
  position: fixed; z-index: 20;
  left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(1040px, calc(100vw - 32px));
  background: var(--paper);
  padding: 22px 24px 20px;
  box-shadow: 0 30px 80px rgba(0,0,0,.14);
  pointer-events: none;
  opacity: 0; transition: opacity .5s, transform .5s;
}
body.intro #intro { opacity: 1; }
body:not(.intro) #intro { transform: translate(-50%, -47%); visibility: hidden; transition: opacity .5s, transform .5s, visibility 0s .5s; }
.hl { margin: 0; font: 800 clamp(26px, 6.3vw, 86px)/.9 var(--sans); letter-spacing: -.045em; text-transform: uppercase; }
.hl .row { display: flex; align-items: center; justify-content: space-between; gap: .18em; white-space: nowrap; }
.hl .row > span { flex: none; }
.hl .row + .row { margin-top: .06em; }
.hl .pill { font-size: max(11px, .1em); letter-spacing: 0; padding: .45em .8em .38em; align-self: flex-start; margin-top: .25em; min-height: 0; }
.hl .inset { height: .78em; width: auto; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
#intro .tip { margin: 18px 0 0; font: 400 15px/1.4 var(--mono); color: var(--soft); }

/* ---------- Fiche projet ---------- */
#focus { position: fixed; inset: 0; z-index: 40; pointer-events: none; visibility: hidden; transition: visibility 0s 1s; }
#focus.on { pointer-events: auto; visibility: visible; transition: none; }
.flood {
  position: absolute; left: -5%; right: -5%; top: 0; height: 100%;
  background: var(--c, #F2F2F0);
  transform: translateY(115%);
  transition: transform .9s cubic-bezier(.7,0,.2,1);
}
.flood svg { position: absolute; left: 0; bottom: 100%; width: 100%; height: 140px; display: block; }
.flood svg path { fill: var(--c, #F2F2F0); }
#focus.on .flood { transform: translateY(0); }
.inner {
  position: absolute; inset: 0; overflow-y: auto;
  display: grid; place-items: center;
  padding-inline: 20px;
  padding-block: calc(72px + env(safe-area-inset-top, 0px)) calc(64px + env(safe-area-inset-bottom, 0px));
  opacity: 0; transition: opacity .3s;
}
#focus.on .inner { opacity: 1; transition: opacity .5s .55s; }
.sheet { display: grid; grid-template-columns: auto minmax(0, 400px); align-items: end; gap: 40px; max-width: 100%; }
.big {
  display: block; position: relative; cursor: pointer; line-height: 0;
  transform: translateY(24px); transition: transform .7s cubic-bezier(.2,.8,.2,1) .5s;
  box-shadow: 0 30px 60px rgba(0,0,0,.18);
}
#focus.on .big { transform: none; }
.big img { display: block; max-width: min(54vw, 560px); max-height: 66vh; width: auto; height: auto; }
.info { display: grid; gap: 14px; justify-items: start; }
.info .k { font: 400 15px/1.3 var(--mono); }
.info h2 { margin: 0; font: 800 clamp(36px, 5.2vw, 72px)/.9 var(--sans); letter-spacing: -.04em; text-transform: uppercase; text-wrap: balance; }
.info p { margin: 0; font-size: 18px; line-height: 1.5; max-width: 36ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.tags .pill { cursor: default; }
.tags .pill:hover { background: transparent; color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.process { display: flex; flex-wrap: wrap; gap: 4px; max-height: 156px; overflow-y: auto; margin: 0; padding: 2px; list-style: none; }
.process:empty { display: none; }
.process button { padding: 0; border: 0; cursor: zoom-in; line-height: 0; }
.process img { width: 52px; height: 52px; object-fit: cover; }
.pqr { display: flex; align-items: center; gap: 12px; }
.pqr .code canvas, .pqr .code img { width: 72px; height: 72px; }
.pqr span { font: 400 13px/1.35 var(--mono); max-width: 22ch; }
.fnav { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: 20px; right: 20px; display: flex; gap: 8px; align-items: center; }
.fnav .count { font: 400 15px/1 var(--mono); margin-left: 6px; }
.fnav #close { margin-left: auto; }
.flyer { position: fixed; z-index: 45; margin: 0; pointer-events: none; transform-origin: 0 0; }
#focus.flip .big { opacity: 0; transition: none; transform: none; }

/* ---------- Agrandissement ---------- */
#zoom { position: fixed; inset: 0; z-index: 50; background: rgba(255,255,255,.98); display: grid; place-items: center; padding: 72px 76px; }
#zoom figure { margin: 0; display: grid; gap: 10px; justify-items: center; }
#zoom img, #zoom video { max-width: 100%; max-height: calc(100vh - 170px); display: block; }
#zoom video { background: #000; }
#zoom figcaption { font: 400 15px/1.3 var(--mono); }
#zoomClose { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 20px; }
#zoom .arrow { position: absolute; }
#zoomPrev { left: 12px; }
#zoomNext { right: 12px; }

/* ---------- À propos ---------- */
#about { position: fixed; z-index: 55; inset: 0; display: flex; justify-content: flex-end; background: rgba(17,17,17,.3); }
#about .panel {
  width: min(480px, 100%); height: 100%; overflow-y: auto;
  background: var(--paper);
  padding-inline: 28px;
  padding-block: calc(18px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
  display: grid; align-content: start; gap: 20px;
  animation: slide .45s cubic-bezier(.2,.8,.2,1);
}
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
#about .top { display: flex; justify-content: flex-end; }
#about .portrait { width: 56%; aspect-ratio: 4 / 5; background: var(--ink); color: var(--paper); display: grid; place-items: center; overflow: hidden; }
#about .portrait img { width: 70%; height: auto; filter: invert(1); }
#about .portrait img.photo-real { width: 100%; height: 100%; object-fit: cover; filter: none; }
#about h2 { margin: 0; font: 800 52px/.9 var(--sans); letter-spacing: -.04em; text-transform: uppercase; }
#about p { margin: 0; font-size: 17px; line-height: 1.55; max-width: 38ch; }
#about dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font: 400 15px/1.4 var(--mono); }
#about dt { color: var(--soft); }
#about dd { margin: 0; overflow-wrap: anywhere; }
#about a { color: var(--ink); }

/* ---------- Mode démo ---------- */
#demo {
  position: fixed; z-index: 60; left: 50%; transform: translateX(-50%);
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}
#demo::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #FF5A4A; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .2; } }

@media (max-width: 760px) {
  .bar { grid-template-columns: 1fr auto; }
  #top nav { grid-column: 1 / -1; grid-row: 2; justify-self: start; }
  #bottom { grid-template-columns: 1fr auto; }
  #hint { display: none; }
  #filters { justify-content: start; gap: 2px 10px; }
  #filters button { font-size: 15px; }
  .qr span { display: none; }
  .qr .code canvas, .qr .code img { width: 50px; height: 50px; }
  #intro { padding: 16px; }
  .sheet { grid-template-columns: 1fr; gap: 22px; justify-items: start; }
  .big img { max-width: calc(100vw - 40px); max-height: 40vh; }
  .pqr { display: none; }
  .arrow { width: 48px; height: 48px; top: auto; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: none; }
  #zoom { padding: 72px 12px 110px; }
  #zoom .arrow { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
}
/* Animations réduites : demandé par le système ou par le bouton Pause */
@media (prefers-reduced-motion: reduce) {
  .flood, .inner, .big { transition-duration: .01s !important; transition-delay: 0s !important; }
  #demo::before, .card.pulse .shot { animation: none; }
}
body.still .flood, body.still .inner, body.still .big { transition-duration: .01s !important; transition-delay: 0s !important; }
body.still .card.pulse .shot { animation: none; }
</style>
</head>
<body>

<a class="skip" href="#stage" id="skip"></a>

<header class="bar" id="top">
  <div id="name"><img src="vignettes/logo.png" alt="Logo LT"><span>Léa Tramati<small data-t="context"></small></span></div>
  <nav aria-label="Menu">
    <button class="pill" type="button" id="pause" aria-pressed="false"></button>
    <button class="pill" type="button" id="navAbout" aria-haspopup="dialog"></button>
  </nav>
  <div id="right">
    <div class="langs" role="group" id="langs">
      <button type="button" data-lang="fr" id="lang-fr" lang="fr" aria-label="Français">FR</button>
      <button type="button" data-lang="en" id="lang-en" lang="en" aria-label="English">EN</button>
      <button type="button" data-lang="de" id="lang-de" lang="de" aria-label="Deutsch">DE</button>
    </div>
    <button class="pill" id="full" type="button">⛶</button>
  </div>
</header>

<main id="stage" tabindex="-1"></main>

<button class="arrow" id="goPrev" type="button">←</button>
<button class="arrow" id="goNext" type="button">→</button>

<footer class="bar" id="bottom">
  <p id="hint"></p>
  <div id="filters" role="group"></div>
  <div class="qr">
    <span data-t="scanSite"></span>
    <div class="code" id="siteQr" role="img"></div>
  </div>
</footer>

<div id="intro" aria-hidden="true">
  <p class="hl" id="hl"></p>
  <p class="tip" id="tip"></p>
</div>

<p class="sr" id="live" aria-live="polite"></p>

<span class="pill solid" id="demo" hidden><span data-t="demo"></span></span>

<section id="focus" role="dialog" aria-modal="true" aria-labelledby="fTitle" aria-hidden="true">
  <div class="flood" aria-hidden="true">
    <svg viewBox="0 0 1200 140" preserveAspectRatio="none">
      <path d="M0 140 L0 96 C 180 112, 300 64, 520 40 C 760 14, 960 70, 1200 22 L1200 140 Z"></path>
    </svg>
  </div>
  <div class="inner">
    <div class="sheet">
      <a class="big" id="big"></a>

        <span class="k" id="fKind"></span>

        <div class="pqr"><div class="code" id="projQr" role="img"></div><span id="fScan"></span></div>
      </div>

<div id="about" hidden>
  <aside class="panel" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
    <div class="top"><button class="pill" id="aboutClose" type="button"></button></div>
    <div class="portrait" id="portrait"></div>
    <h2 id="aboutTitle">Léa<br>Tramati</h2>
    <p data-t="bio1"></p>
    <p data-t="bio2"></p>
    <dl>
      <dt data-t="where"></dt><dd>KISD — Köln International School of Design</dd>
      <dt data-t="what"></dt><dd data-t="fields"></dd>
      <dt data-t="contact"></dt><dd id="contact"></dd>
      <dt>GitHub</dt><dd><a href="https://github.com/lea-tramati" target="_blank" rel="noopener">github.com/lea-tramati</a></dd>
    </dl>
  </aside>
</div>

<div id="zoom" role="dialog" aria-modal="true" aria-labelledby="zoomCap" hidden>
  <button class="pill" id="zoomClose" type="button"></button>
  <button class="arrow" id="zoomPrev" type="button">←</button>
  <figure><div id="zoomBody"></div><figcaption id="zoomCap"></figcaption></figure>
  <button class="arrow" id="zoomNext" type="button">→</button>
</div>

<script>
/* ═══════════════ RÉGLAGES ═══════════════
   SITE_URL : adresse publique (QR codes).
   Mode expo : ajouter #expo à l'adresse → démo automatique après IDLE_SECONDS sans activité,
   les projets s'ouvrent dans le même onglet. */
const SITE_URL = "https://lea-tramati.github.io/portfolio/";
const IDLE_SECONDS = 30;
const DEMO_STEP_SECONDS = 8;
/* Photo pour « À propos » : par ex. "vignettes/portrait.jpg" (vide : votre logo). */
const PORTRAIT = "";
/* Contact : par ex. { label: "@lea.tramati", href: "https://instagram.com/lea.tramati" } */
const CONTACT = null;

/* Photos d'ambiance : soirée « potluck! ». Décoratives dans le carrousel, en galerie dans le projet Potluck. */
const PHOTOS = ["photos/IMG_1411.jpg","photos/IMG_1412.jpg","photos/IMG_1413.jpg","photos/IMG_1414.jpg","photos/IMG_1415.jpg","photos/IMG_1416.jpg","photos/IMG_1417.jpg","photos/IMG_1418.jpg","photos/IMG_1419.jpg","photos/IMG_1420.jpg","photos/IMG_1421.jpg","photos/IMG_1422.jpg","photos/IMG_1423.jpg","photos/IMG_1424.jpg","photos/IMG_1425.jpg","photos/IMG_1426.jpg","photos/IMG_1427.jpg","photos/IMG_1428.jpg","photos/IMG_1429.jpg","photos/IMG_1430.jpg","photos/IMG_1431.jpg","photos/IMG_1432.jpg","photos/IMG_1434.jpg","photos/IMG_1435.jpg","photos/IMG_1436.jpg","photos/IMG_1437.jpg","photos/IMG_1438.jpg","photos/IMG_1439.jpg","photos/IMG_1440.jpg","photos/IMG_1443.jpg","photos/IMG_1444.jpg"];

/* ═══════════════ PROJETS ═══════════════
   type : "lien", "affiche", "galerie", "video", "videos" ; groupes : filtres du bas
   alt : description de l'image pour les lecteurs d'écran */

let lang = (() => {
  try { const s = localStorage.getItem("lang"); if (T[s]) return s; } catch {}
  const n = (navigator.language || "en").slice(0, 2);
  return T[n] ? n : "en";
})();
const t = k => T[lang][k];

/* ═══════════════ Outils ═══════════════ */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const mod = (a, n) => ((a % n) + n) % n;
const sysReduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let still = sysReduce;
try { if (localStorage.getItem("still") === "1") still = true; } catch {}
const EXPO = location.hash === "#expo";
const RATIOS = { paysage: 4 / 3, portrait: 3 / 4, carre: 1, affiche: 1 / 1.414, story: 9 / 16 };
const isVideo = src => /\.mp4$/i.test(src);
const N = PROJETS.length;

function rng(seed) {
  let h = 2166136261 >>> 0;
  for (const ch of String(seed)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return () => {
    h += 0x6D2B79F5;
    let x = h;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
function thumb(p, width, withAlt) {
  const ratio = RATIOS[p.format] || 4 / 3;
  const img = new Image();
  img.src = p.image; img.alt = withAlt ? p.alt[lang] : "";
  img.width = Math.round(width); img.height = Math.round(width / ratio);
  img.style.setProperty("--r", String(ratio));
  img.draggable = false;
  return img;
}
function qr(el, text, size, label) {
  el.replaceChildren();
  el.setAttribute("aria-label", label);
  if (!window.QRCode) return;
  new QRCode(el, { text, width: size, height: size, colorDark: "#111111", colorLight: "#FFFFFF", correctLevel: QRCode.CorrectLevel.M });
  el.querySelectorAll("img, canvas").forEach(x => { x.setAttribute("aria-hidden", "true"); if (x.tagName === "IMG") x.alt = ""; });
}
function announce(msg) { const l = $("live"); l.textContent = ""; setTimeout(() => { l.textContent = msg; }, 30); }
const projectUrl = p => p.type === "lien" ? p.lien : SITE_URL + "#" + p.id;
let filtre = "all";
const visible = p => filtre === "all" || p.groupes.includes(filtre);

/* ═══════════════ Carrousel ═══════════════ */
const stage = $("stage");
let items = [], photoItems = [], world = 0, offset = 0, vel = 0, target = null, sel = 0;
const DRIFT = 0.3;

function build() {
  const vw = stage.clientWidth, vh = stage.clientHeight;
  const small = vw < 640;
  const r = rng("disposition");
  const step = small ? 250 : 330;
  world = Math.max(N * step, vw + 560);
  const gap = world / N;
  stage.replaceChildren();

  items = PROJETS.map((p, i) => {
    const ratio = RATIOS[p.format] || 4 / 3;
    const base = (small ? 150 : 215) + r() * (small ? 30 : 50);
    const w = Math.round(base * (ratio < 0.6 ? 0.62 : ratio < 1 ? 0.8 : 1));
    const h = w / ratio;
    const avail = vh * (small ? 0.58 : 0.66);
    const y = Math.max(vh * (small ? 0.2 : 0.14), vh * (small ? 0.2 : 0.16) + (i % 2) * Math.max(0, avail - h - 90) * (0.55 + r() * 0.35));

    const b = document.createElement("button");
    b.className = "card"; b.type = "button"; b.id = "card-" + p.id;
    b.style.width = w + "px";
    b.setAttribute("aria-label", T[lang].projectOf(i + 1, N, p));
    const f = document.createElement("span");
    f.className = "shot";
    f.append(thumb(p, w * 2));
    const over = document.createElement("span");
    over.className = "over"; over.setAttribute("aria-hidden", "true"); over.textContent = t("open") + " →";
    f.append(over);
    const cap = document.createElement("span");
    cap.className = "cap"; cap.setAttribute("aria-hidden", "true");
    cap.innerHTML = '<span class="n"></span> <span></span> <span class="c"></span>';
    cap.children[0].textContent = pad(i + 1);
    cap.children[1].textContent = p.titre;
    cap.children[2].textContent = `[${p.cat[lang]}]`;
    const cta = document.createElement("span");
    cta.className = "pill"; cta.setAttribute("aria-hidden", "true");
    cta.textContent = t("open") + " →";
    b.append(f, cap, cta);
    b.addEventListener("click", e => { if (moved > 6) { e.preventDefault(); return; } sel = i; openFocus(i, false, f); });
    b.addEventListener("focus", () => { sel = i; markSel(); center(i); });
    if ((p.video || p.preview) && !still) {
      b.addEventListener("pointerenter", e => {
        if (e.pointerType !== "mouse" || still) return;
        const v = document.createElement("video");
        v.src = p.preview || p.video; v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true;
        v.setAttribute("aria-hidden", "true");
        v.style.setProperty("--r", String(ratio));
        f.firstChild.replaceWith(v);
        v.play().catch(() => {});
      });
      b.addEventListener("pointerleave", () => { const v = f.querySelector("video"); if (v) v.replaceWith(thumb(p, w * 2)); });
    }
    stage.append(b);
    return { el: b, p, i, base: i * gap + r() * gap * 0.15, y, w, h: h + 90, phase: r() * 6.28 };
  });

  /* Photos décoratives : petites, en arrière-plan, jamais sur un projet */
  const boxes = items.map(it => ({ x: it.base - 30, y: it.y - 30, w: it.w + 60, h: it.h + 50 }));
  const top = vh * (small ? 0.2 : 0.14), bottom = vh * 0.8;
  photoItems = [];
  PHOTOS.forEach((src, j) => {
    if (j % 2) return; // une photo sur deux : les projets restent au premier plan
    const w = Math.round((small ? 50 : 62) + r() * (small ? 20 : 36));
    const h = w * 0.75;
    for (let tries = 0; tries < 40; tries++) {
      const x = ((j + r()) / PHOTOS.length) * world + (tries ? (r() - 0.5) * gap : 0);
      const y = top + r() * Math.max(10, bottom - top - h);
      const box = { x: x - 10, y: y - 10, w: w + 20, h: h + 20 };
      const hit = boxes.some(o => {
        const dx = mod(box.x - o.x + world / 2, world) - world / 2;
        return dx < o.w && -dx < box.w && box.y < o.y + o.h && o.y < box.y + box.h;
      });
      if (hit) continue;
      boxes.push(box);
      const el = document.createElement("div");
      el.className = "photo"; el.setAttribute("aria-hidden", "true");
      el.style.width = w + "px";
      const img = new Image(); img.src = src; img.alt = ""; img.draggable = false; img.decoding = "async";
      el.append(img);
      stage.prepend(el);
      photoItems.push({ el, base: x, y, w, h, phase: r() * 6.28 });
      break;
    }
  });
  applyFilter();
  markSel();
  place();
}

let mx = 0, my = 0, tmx = 0, tmy = 0;
function position(it, now) {
  const x = mod(it.base - offset, world) - 280;
  it.x = x;
  const bob = still ? 0 : Math.sin(now * 0.0007 + it.phase) * 5;
  it.sx = x + mx * 14;
  it.sy = it.y + bob + my * 8;
  it.el.style.transform = `translate3d(${it.sx.toFixed(1)}px, ${it.sy.toFixed(1)}px, 0)`;
}
function place() {
  const now = performance.now();
  for (const it of photoItems) position(it, now);
  for (const it of items) position(it, now);
}
/* Amène le projet i au centre de l'écran */
function center(i, instant) {
  const it = items[i];
  if (!it) return;
  const vw = stage.clientWidth;
  const delta = (it.x + it.w / 2) - vw / 2;
  if (Math.abs(delta) < 4) return;
  vel = 0;
  if (instant || still) { offset += delta; target = null; place(); }
  else target = offset + delta;
}
function markSel() { items.forEach(it => it.el.classList.toggle("sel", it.i === sel && document.body.classList.contains("kbd"))); }
/* Navigation par flèches (clavier ou boutons à l'écran) */
function go(d) {
  hideIntro();
  let i = sel;
  for (let k = 0; k < N; k++) { i = mod(i + d, N); if (visible(PROJETS[i])) break; }
  sel = i;
  center(i);
  items[i].el.focus({ preventScroll: true });
  markSel();
  announce(T[lang].now(i + 1, N, PROJETS[i]));
}

let paused = false, hover = false, focusInStage = false;
function tick() {
  if (!paused) {
    vel *= 0.92;
    mx += (tmx - mx) * 0.05; my += (tmy - my) * 0.05;
    if (target !== null) {
      const d = target - offset;
      offset += d * 0.12;
      if (Math.abs(d) < 0.5) { offset = target; target = null; }
    } else {
      offset += vel + (hover || focusInStage || still ? 0 : DRIFT);
    }
    place();
  }
  requestAnimationFrame(tick);
}

/* Une image « pulse » de temps en temps pour inviter au clic */
setInterval(() => {
  if (paused || still || focusInStage) return;
  const vw = stage.clientWidth;
  const vis = items.filter(it => it.sx > 80 && it.sx + it.w < vw - 80 && visible(it.p));
  if (!vis.length) return;
  const it = vis[Math.floor(Math.random() * vis.length)];
  it.el.classList.remove("pulse"); void it.el.offsetWidth; it.el.classList.add("pulse");
  setTimeout(() => it.el.classList.remove("pulse"), 1700);
}, 3000);

/* Souris et tactile */
let down = false, lastX = 0, moved = 0;
stage.addEventListener("pointerdown", e => { down = true; moved = 0; lastX = e.clientX; vel = 0; target = null; document.body.classList.remove("kbd"); markSel(); });
addEventListener("pointermove", e => {
  if (e.pointerType === "mouse" && !still) { tmx = e.clientX / innerWidth - 0.5; tmy = e.clientY / innerHeight - 0.5; }
  if (!down) return;
  const dx = e.clientX - lastX;
  lastX = e.clientX;
  moved += Math.abs(dx);
  if (moved > 6) stage.classList.add("dragging");
  offset -= dx; vel = -dx * 0.9;
}, { passive: true });
addEventListener("pointerup", () => { down = false; stage.classList.remove("dragging"); });
stage.addEventListener("wheel", e => {
  e.preventDefault(); target = null;
  vel += (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * 0.06;
}, { passive: false });
stage.addEventListener("pointerover", e => { hover = !!e.target.closest(".card"); });
stage.addEventListener("pointerleave", () => { hover = false; });
stage.addEventListener("focusin", () => { focusInStage = true; });
stage.addEventListener("focusout", () => { focusInStage = false; });
$("goPrev").addEventListener("click", () => go(-1));
$("goNext").addEventListener("click", () => go(1));

/* ═══════════════ Filtres ═══════════════ */
const GROUPS = ["web", "affiche", "app", "jeu", "video", "photo"];
function renderFilters() {
  const el = $("filters");
  el.setAttribute("aria-label", t("filterLabel"));
  const opts = [["all", t("all"), N], ...GROUPS.map(g => [g, t("groups")[g], PROJETS.filter(p => p.groupes.includes(g)).length])];
  el.replaceChildren(...opts.filter(o => o[2] > 0).map(([g, label, n]) => {
    const b = document.createElement("button");
    b.type = "button"; b.id = "filter-" + g;
    b.setAttribute("aria-pressed", String(filtre === g));
    b.innerHTML = '<span></span><sup aria-hidden="true"></sup><span class="sr"></span>';
    b.children[0].textContent = label; b.children[1].textContent = n; b.children[2].textContent = ` (${n})`;
    b.addEventListener("click", () => {
      filtre = g; renderFilters(); applyFilter(); hideIntro();
      const first = PROJETS.findIndex(visible);
      if (first >= 0 && !visible(PROJETS[sel])) { sel = first; center(first); }
      $("filter-" + g).focus();
      announce(`${label} : ${n}`);
    });
    return b;
  }));
}
function applyFilter() {
  document.body.classList.toggle("filtered", filtre !== "all");
  for (const it of items) {
    const off = !visible(it.p);
    it.el.classList.toggle("dim", off);
    it.el.tabIndex = off ? -1 : 0;
    if (off) it.el.setAttribute("aria-hidden", "true"); else it.el.removeAttribute("aria-hidden");
  }
}

/* ═══════════════ Accueil ═══════════════ */
function renderIntro() {
  const insets = ["vignettes/intrusion.jpg", "vignettes/robert-wun.jpg"];
  $("hl").replaceChildren(...t("hl").map(row => {
    const d = document.createElement("span");
    d.className = "row";
    row.forEach((part, k) => {
      if (part.startsWith("img:")) {
        const img = new Image(); img.src = insets[+part.slice(4)]; img.alt = ""; img.className = "inset";
        d.append(img);
      } else {
        const s = document.createElement("span");
        if (k === 1 && row.length === 3) s.className = "pill";
        s.textContent = part; d.append(s);
      }
    });
    return d;
  }));
  $("tip").textContent = t("tip");
}
function showIntro() { document.body.classList.add("intro"); }
function hideIntro() { document.body.classList.remove("intro"); }
stage.addEventListener("pointerdown", hideIntro);
stage.addEventListener("wheel", hideIntro, { passive: true });
stage.addEventListener("pointerover", e => { if (e.target.closest(".card")) hideIntro(); });
addEventListener("keydown", hideIntro);

/* ═══════════════ Fenêtres (fiche, zoom, à propos) : focus piégé ═══════════════ */
const focusEl = $("focus"), zoomEl = $("zoom"), aboutEl = $("about");
const outside = () => [$("top"), stage, $("bottom"), $("goPrev"), $("goNext"), $("skip")];
function topDialog() {
  if (!zoomEl.hidden) return zoomEl;
  if (!aboutEl.hidden) return aboutEl;
  if (focusEl.classList.contains("on")) return focusEl;
  return null;
}
function syncInert() {
  const d = topDialog();
  outside().forEach(el => { el.inert = !!d; });
  focusEl.inert = !!d && d !== focusEl;
}
addEventListener("keydown", e => {
  if (e.key !== "Tab") return;
  const d = topDialog();
  if (!d) return;
  const f = [...d.querySelectorAll('a[href], button:not([disabled]), video[controls], [tabindex="0"]')].filter(x => x.offsetParent !== null || x === document.activeElement);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  else if (!d.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
});

/* ═══════════════ Fiche projet ═══════════════ */
let current = -1, lastFocus = null;
function pillButton(label, onClick, solid) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "pill big" + (solid ? " solid" : "");
  b.innerHTML = `<span></span><span aria-hidden="true">→</span>`;
  b.firstChild.textContent = label;
  b.addEventListener("click", onClick);
  return b;
}
function linkPill(p) {
  const a = document.createElement("a");
  a.className = "pill big solid"; a.href = p.lien;
  a.innerHTML = `<span></span><span aria-hidden="true">↗</span>`;
  a.firstChild.textContent = t("open");
  if (!EXPO) { a.target = "_blank"; a.rel = "noopener"; const s = document.createElement("span"); s.className = "sr"; s.textContent = " " + t("newTab"); a.append(s); }
  return a;
}
function mainAction(p) {
  if (p.videos) return () => zoom(p.videos, 0);
  if (p.type === "video") return () => zoom([p.video], 0);
  if (p.galerie) return () => zoom(p.galerie, 0);
  return () => zoom([p.image], 0, p);
}
function fill(i) {
  const p = PROJETS[i];
  focusEl.style.setProperty("--c", p.couleur);
  const big = $("big");
  big.replaceChildren(thumb(p, 900, true));
  big.onclick = null; big.onkeydown = null;
  if (p.type === "lien") {
    big.href = p.lien; big.removeAttribute("role"); big.removeAttribute("tabindex");
    if (EXPO) big.removeAttribute("target"); else { big.target = "_blank"; big.rel = "noopener"; }
    big.setAttribute("aria-label", `${t("open")} : ${p.titre} ${EXPO ? "" : t("newTab")}`);
  } else {
    const run = mainAction(p);
    big.removeAttribute("href"); big.removeAttribute("target");
    big.setAttribute("role", "button"); big.tabIndex = 0;
    big.setAttribute("aria-label", `${p.videos ? t("videos") : p.type === "video" ? t("video") : p.galerie ? t("photos") : t("poster")} : ${p.titre}`);
    big.onclick = run;
    big.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); run(); } };
  }
  $("fKind").textContent = `${pad(i + 1)} [${p.cat[lang]}]`;
  $("fTitle").textContent = p.titre;
  $("fDesc").textContent = p.desc[lang];
  $("fTags").replaceChildren(...(p.tags || []).map(x => { const s = document.createElement("li"); s.className = "pill"; s.textContent = x; return s; }));
  const acts = [];
  if (p.type === "lien") acts.push(linkPill(p));
  else if (p.type === "galerie") acts.push(pillButton(t("photos"), mainAction(p), true));
  else if (p.type === "video") acts.push(pillButton(t("video"), mainAction(p), true));
  else if (p.type === "videos") acts.push(pillButton(t("videos"), mainAction(p), true));
  else acts.push(pillButton(t("poster"), mainAction(p), true));
  if (p.video && p.type !== "video") acts.push(pillButton(t("teaser"), () => zoom([p.video], 0)));
  $("fActions").replaceChildren(...acts);
  const list = p.videos || p.galerie || [];
  $("fProcess").replaceChildren(...list.map((src, k) => {
    const li = document.createElement("li");
    const b = document.createElement("button"); b.type = "button";
    b.setAttribute("aria-label", isVideo(src) ? T[lang].videoOf(k + 1, list.length, p.videoTitles[k]) : T[lang].photoOf(k + 1, list.length));
    const img = new Image(); img.src = isVideo(src) ? src.replace(/\.mp4$/, ".jpg") : src; img.alt = ""; img.loading = "lazy"; b.append(img);
    b.addEventListener("click", () => zoom(list, k, p));
    li.append(b);
    return li;
  }));
  $("fScan").textContent = t("scanProject");
  qr($("projQr"), projectUrl(p), 144, t("qrProject"));
  $("fCount").textContent = `${pad(i + 1)} / ${pad(N)}`;
}
function openFocus(i, quiet, fromEl) {
  if (current < 0) lastFocus = document.activeElement;
  hideIntro();
  current = i; sel = i;
  fill(i);
  if (fromEl && !still) fly(fromEl);
  paused = true;
  focusEl.classList.add("on");
  focusEl.setAttribute("aria-hidden", "false");
  syncInert();
  if (!quiet) setTimeout(() => $("fActions").firstChild?.focus({ preventScroll: true }), still ? 0 : 650);
}
function fly(fromEl) {
  const big = $("big");
  const r0 = fromEl.getBoundingClientRect();
  focusEl.classList.add("flip");
  const r1 = big.getBoundingClientRect();
  const c = fromEl.cloneNode(true);
  c.querySelector(".over")?.remove();
  c.classList.add("flyer"); c.setAttribute("aria-hidden", "true");
  Object.assign(c.style, { left: r0.left + "px", top: r0.top + "px", width: r0.width + "px" });
  document.body.append(c);
  const k = r1.width / r0.width;
  const a = c.animate([
    { transform: "translate(0, 0) scale(1)" },
    { transform: `translate(${r1.left - r0.left}px, ${r1.top - r0.top}px) scale(${k})` },
  ], { duration: 850, easing: "cubic-bezier(.7,0,.2,1)", fill: "forwards" });
  a.onfinish = () => { focusEl.classList.remove("flip"); requestAnimationFrame(() => c.remove()); };
}
function closeFocus() {
  if (current < 0) return;
  focusEl.classList.remove("on");
  focusEl.setAttribute("aria-hidden", "true");
  paused = false;
  current = -1;
  syncInert();
  center(sel, true);
  const back = items[sel]?.el || lastFocus;
  back?.focus?.({ preventScroll: true });
}
function shift(d) {
  if (current < 0) return;
  current = mod(current + d, N);
  sel = current;
  fill(current);
  announce(T[lang].now(current + 1, N, PROJETS[current]));
}

/* ═══════════════ Agrandissement : affiches, photos, vidéos ═══════════════ */
let zoomList = [], zoomAt = 0, zoomProject = null, zoomReturn = null;
function zoom(list, at, p) {
  if (zoomEl.hidden) zoomReturn = document.activeElement;
  zoomList = list; zoomAt = at; zoomProject = p || PROJETS[current] || null;
  const src = list[at];
  const body = $("zoomBody");
  const many = list.length > 1;
  $("zoomPrev").hidden = $("zoomNext").hidden = !many;
  let cap;
  if (isVideo(src)) {
    const v = document.createElement("video");
    v.src = src; v.controls = true; v.playsInline = true; v.autoplay = !still;
    if (zoomProject?.videoTitles) cap = T[lang].videoOf(at + 1, list.length, zoomProject.videoTitles[at]);
    else cap = zoomProject ? zoomProject.titre : "";
    v.setAttribute("aria-label", cap);
    if (many) v.addEventListener("ended", () => zoomShift(1));
    body.replaceChildren(v);
  } else {
    const img = new Image(); img.src = src;
    if (zoomProject?.galerie) { cap = T[lang].photoOf(at + 1, list.length); img.alt = cap; }
    else { cap = zoomProject ? zoomProject.titre : ""; img.alt = zoomProject ? zoomProject.alt[lang] : ""; }
    body.replaceChildren(img);
  }
  $("zoomCap").textContent = cap;
  zoomEl.hidden = false;
  syncInert();
  $("zoomClose").focus({ preventScroll: true });
  if (many) announce(cap);
}
function zoomShift(d) {
  if (zoomList.length < 2) return;
  zoom(zoomList, mod(zoomAt + d, zoomList.length), zoomProject);
}
function unzoom() {
  if (zoomEl.hidden) return false;
  zoomEl.hidden = true;
  $("zoomBody").replaceChildren();
  syncInert();
  zoomReturn?.focus?.({ preventScroll: true });
  return true;
}
zoomEl.addEventListener("click", e => { if (e.target === zoomEl) unzoom(); });
$("zoomClose").addEventListener("click", unzoom);
$("zoomPrev").addEventListener("click", () => zoomShift(-1));
$("zoomNext").addEventListener("click", () => zoomShift(1));

/* ═══════════════ À propos ═══════════════ */
let aboutReturn = null;
function openAbout() {
  if (aboutEl.hidden) aboutReturn = document.activeElement;
  hideIntro();
  const box = $("portrait");
  box.replaceChildren();
  const img = new Image();
  if (PORTRAIT) { img.src = PORTRAIT; img.alt = "Léa Tramati"; img.className = "photo-real"; }
  else { img.src = "vignettes/logo.png"; img.alt = "Logo LT"; }
  box.append(img);
  const c = $("contact");
  if (CONTACT) { const a = document.createElement("a"); a.href = CONTACT.href; a.target = "_blank"; a.rel = "noopener"; a.textContent = CONTACT.label; c.replaceChildren(a); }
  else c.textContent = t("noContact");
  aboutEl.hidden = false;
  $("navAbout").setAttribute("aria-expanded", "true");
  syncInert();
  $("aboutClose").focus({ preventScroll: true });
}
function closeAbout() {
  if (aboutEl.hidden) return false;
  aboutEl.hidden = true;
  $("navAbout").setAttribute("aria-expanded", "false");
  syncInert();
  aboutReturn?.focus?.({ preventScroll: true });
  return true;
}
$("navAbout").addEventListener("click", openAbout);
$("aboutClose").addEventListener("click", closeAbout);
aboutEl.addEventListener("click", e => { if (e.target === aboutEl) closeAbout(); });

/* ═══════════════ Pause des animations ═══════════════ */
function applyStill() {
  document.body.classList.toggle("still", still);
  const b = $("pause");
  b.setAttribute("aria-pressed", String(still));
  b.textContent = still ? "▶ " + t("play") : "❚❚ " + t("pause");
  b.setAttribute("aria-label", still ? t("playLabel") : t("pauseLabel"));
}
$("pause").addEventListener("click", () => {
  still = !still;
  try { localStorage.setItem("still", still ? "1" : "0"); } catch {}
  applyStill();
  build();
});

/* ═══════════════ Démo automatique (mode expo) ═══════════════ */
let idleTimer = null, demoTimer = null, demoOn = false, demoIndex = -1;
function startDemo() {
  demoOn = true;
  $("demo").hidden = false;
  demoIndex = -1;
  unzoom(); closeAbout(); closeFocus(); filtre = "all"; renderFilters(); applyFilter();
  showIntro();
  demoTimer = setTimeout(demoStep, 7000);
}
function demoStep() {
  unzoom(); hideIntro();
  demoIndex = (demoIndex + 1) % N;
  if (current >= 0) {
    closeFocus();
    demoTimer = setTimeout(() => { openFocus(demoIndex, true); demoTimer = setTimeout(demoStep, DEMO_STEP_SECONDS * 1000); }, still ? 300 : 1300);
  } else {
    openFocus(demoIndex, true);
    demoTimer = setTimeout(demoStep, DEMO_STEP_SECONDS * 1000);
  }
}
function stopDemo() {
  clearTimeout(demoTimer);
  demoOn = false;
  $("demo").hidden = true;
  closeFocus(); hideIntro();
}
function activity(e) {
  if (demoOn) { stopDemo(); if (e && e.cancelable) { e.preventDefault(); e.stopPropagation(); } }
  if (!EXPO) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(startDemo, IDLE_SECONDS * 1000);
}
if (EXPO) {
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(ev => addEventListener(ev, activity, { capture: true, passive: false }));
  activity();
}

/* ═══════════════ Langue, plein écran, clavier ═══════════════ */
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("langs").setAttribute("aria-label", t("langs"));
  $("skip").textContent = t("skip");
  stage.setAttribute("aria-label", t("stage"));
  stage.setAttribute("aria-roledescription", t("stage"));
  $("hint").innerHTML = t("hint");
  $("navAbout").textContent = t("about");
  $("close").textContent = t("close");
  $("zoomClose").textContent = t("close");
  $("aboutClose").textContent = t("close");
  $("prev").textContent = t("prevP"); $("prev").setAttribute("aria-label", t("prevLabel"));
  $("next").textContent = t("nextP"); $("next").setAttribute("aria-label", t("nextLabel"));
  $("goPrev").setAttribute("aria-label", t("prevLabel")); $("goPrev").title = t("prevLabel");
  $("goNext").setAttribute("aria-label", t("nextLabel")); $("goNext").title = t("nextLabel");
  $("zoomPrev").setAttribute("aria-label", t("prevItem"));
  $("zoomNext").setAttribute("aria-label", t("nextItem"));
  $("full").setAttribute("aria-label", t("full")); $("full").title = t("full");
  qr($("siteQr"), SITE_URL, 128, t("qrSite"));
  applyStill();
  renderIntro(); renderFilters(); build();
  if (current >= 0) fill(current);
  if (!aboutEl.hidden) openAbout();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("lang", lang); } catch {}
  applyLang();
  $("lang-" + lang).focus();
}));
$("full").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  else document.documentElement.requestFullscreen?.().catch(() => {});
});
if (!document.fullscreenEnabled) $("full").hidden = true;
$("close").addEventListener("click", closeFocus);
$("prev").addEventListener("click", () => shift(-1));
$("next").addEventListener("click", () => shift(1));
$("skip").addEventListener("click", e => { e.preventDefault(); hideIntro(); const i = PROJETS.findIndex(visible); sel = i; items[i].el.focus(); });

addEventListener("keydown", e => {
  if (e.key === "Tab" || e.key.startsWith("Arrow")) { document.body.classList.add("kbd"); markSel(); }
  if (e.key === "Escape") { if (unzoom() || closeAbout()) return; if (current >= 0) { closeFocus(); return; } }
  if (!zoomEl.hidden) {
    if (e.key === "ArrowRight") { e.preventDefault(); zoomShift(1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); zoomShift(-1); }
    return;
  }
  if (!aboutEl.hidden) return;
  const tag = document.activeElement?.tagName;
  if (current >= 0) {
    if (tag === "VIDEO") return;
    if (e.key === "ArrowRight") shift(1);
    if (e.key === "ArrowLeft") shift(-1);
    return;
  }
  if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); go(1); }
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); go(-1); }
  if (e.key === "Home") { e.preventDefault(); sel = N - 1; go(1); }
  if (e.key === "End") { e.preventDefault(); sel = 0; go(-1); }
});

/* ═══════════════ Démarrage ═══════════════ */
applyLang();
if (!location.hash || EXPO) { showIntro(); setTimeout(() => { if (!demoOn) hideIntro(); }, 7000); }
let rs;
addEventListener("resize", () => { clearTimeout(rs); rs = setTimeout(build, 150); });
requestAnimationFrame(tick);
const deep = PROJETS.findIndex(p => "#" + p.id === location.hash);
if (deep >= 0) openFocus(deep);
</script>
