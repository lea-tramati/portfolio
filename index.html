<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Léa Tramati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;700;900&family=DM+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Univers volontairement clair, comme la vidéo de référence : couleurs explicites, un seul thème. */
:root {
  --paper: #EFECE6;
  --frame: #FFFFFF;
  --ink: #1E221D;
  --soft: #6E6C66;
  --dot: #A9A59C;
  --red: #D7261E;
  --title: "Gabarito", "Segoe UI", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, Consolas, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; }
img { max-width: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 400 14px/1.5 var(--title);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

/* ---------- Scène ---------- */
#stage {
  position: relative;
  z-index: 0;
  isolation: isolate; /* garde les miniatures sous la fiche projet */
  height: 100%;
  overflow: hidden;
  cursor: grab;
  touch-action: pan-y;
}
#stage.dragging { cursor: grabbing; }

.card {
  position: absolute; left: 0; top: 0;
  display: grid; gap: 7px;
  padding: 0; border: 0; background: none;
  text-align: left; color: inherit; font: inherit;
  cursor: pointer;
  will-change: transform;
}
.frame {
  display: block;
  background: var(--frame);
  padding: 5px;
  box-shadow: 0 1px 2px rgba(30,34,29,.08), 0 10px 26px rgba(30,34,29,.12);
  transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s;
}
.frame canvas, .frame img { display: block; width: 100%; height: auto; }
.frame img, .frame video { display: block; width: 100%; height: auto; aspect-ratio: var(--r); object-fit: cover; object-position: top; }
.card { transition: opacity .6s; }
body.intro .card { opacity: .3; }

/* ---------- Accueil ---------- */
#intro {
  position: fixed; z-index: 15;
  left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(760px, calc(100vw - 40px));
  display: grid; gap: 18px; justify-items: center; text-align: center;
  pointer-events: none;
  opacity: 0; transition: opacity .6s, transform .6s;
}
body.intro #intro { opacity: 1; }
#intro::before {
  content: ""; position: absolute; inset: -90px -140px; z-index: -1;
  background: radial-gradient(closest-side, var(--paper) 55%, rgba(239,236,230,0));
}
body:not(.intro) #intro { transform: translate(-50%, -46%); }
#intro .hello {
  margin: 0;
  font: 900 clamp(40px, 7.5vw, 92px)/.92 var(--title);
  letter-spacing: -.03em;
  text-wrap: balance;
}
#intro .sub { margin: 0; font-size: clamp(16px, 1.6vw, 19px); line-height: 1.5; color: var(--ink); max-width: 44ch; text-wrap: pretty; }
#intro .hint {
  display: flex; align-items: center; gap: 12px; margin-top: 8px;
  font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--soft);
}
#intro .swipe { color: var(--ink); animation: swipe 2.2s cubic-bezier(.6,0,.3,1) infinite; }
@keyframes swipe { 0%, 100% { transform: translateX(-14px); } 50% { transform: translateX(14px); } }

/* ---------- À propos ---------- */
.about-btn {
  background: none; border: 1px solid var(--ink); border-radius: 99px;
  font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink); padding: 8px 12px; cursor: pointer;
}
.about-btn:hover { background: var(--ink); color: var(--paper); }
.about-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#about {
  position: fixed; z-index: 55; inset: 0;
  display: flex; justify-content: flex-end;
  background: rgba(30,34,29,.25);
}
#about .panel {
  width: min(440px, 100%); height: 100%; overflow-y: auto;
  background: var(--paper);
  padding-inline: 32px;
  padding-block: calc(28px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
  display: grid; align-content: start; gap: 20px;
  box-shadow: -20px 0 60px rgba(30,34,29,.18);
  animation: slide .5s cubic-bezier(.2,.8,.2,1);
}
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
#about .top { display: flex; justify-content: space-between; align-items: center; }
#about .top .k { font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--soft); }
#about .portrait { background: var(--frame); padding: 6px; box-shadow: 0 10px 26px rgba(30,34,29,.12); width: 62%; transform: rotate(-1.5deg); }
#about .portrait canvas, #about .portrait img { display: block; width: 100%; height: auto; }
#about h2 { margin: 0; font: 900 40px/.95 var(--title); letter-spacing: -.025em; text-transform: uppercase; }
#about p { margin: 0; font-size: 16px; line-height: 1.55; max-width: 38ch; }
#about dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font: 400 12px/1.4 var(--mono); }
#about dt { color: var(--soft); text-transform: uppercase; letter-spacing: .08em; }
#about dd { margin: 0; overflow-wrap: anywhere; }
#about a { color: var(--ink); }

/* ---------- Processus ---------- */
.process { display: flex; flex-wrap: wrap; gap: 8px; }
.process:empty { display: none; }
.process button { padding: 3px; border: 0; background: var(--frame); cursor: zoom-in; box-shadow: 0 4px 12px rgba(30,34,29,.15); }
.process img { display: block; width: 64px; height: 64px; object-fit: cover; }
.process.gallery { max-height: 156px; overflow-y: auto; }
.process.gallery img { width: 52px; height: 52px; }
#zoom img { cursor: e-resize; }
#zoomCount { position: absolute; left: 20px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); font: 400 11px/1 var(--mono); letter-spacing: .1em; color: #9A9C97; }

/* ---------- Transition miniature → fiche ---------- */
.flyer { position: fixed; z-index: 45; margin: 0; pointer-events: none; transform-origin: 0 0; }
#focus.flip .big { opacity: 0; transition: none; transform: none; }
@media (prefers-reduced-motion: reduce) { #intro .swipe { animation: none; } }
.card:hover .frame, .card:focus-visible .frame {
  transform: translateY(-6px) scale(1.04);
  box-shadow: 0 2px 4px rgba(30,34,29,.08), 0 22px 44px rgba(30,34,29,.2);
}
.card:focus-visible { outline: none; }
.card:focus-visible .frame { outline: 2px solid var(--ink); outline-offset: 4px; }
.label {
  font: 500 11px/1.4 var(--mono);
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--soft);
  transition: color .25s;
}
.card:hover .label, .card:focus-visible .label { color: var(--ink); }

/* Fil rouge */
#web { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.frame { position: relative; }
.card .frame::before, .photo::before {
  content: ""; position: absolute; left: 50%; top: -5px; z-index: 2;
  width: 10px; height: 10px; margin-left: -5px; border-radius: 50%;
  background: var(--red);
  box-shadow: 0 1px 2px rgba(0,0,0,.35), inset -2px -2px 0 rgba(0,0,0,.18);
}
.card { z-index: 10; }
.card .num { color: var(--red); font-weight: 500; }
.cta {
  justify-self: start;
  display: inline-flex; align-items: center; gap: 6px;
  font: 500 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
  color: var(--red); border: 1px solid var(--red); border-radius: 99px;
  padding: 6px 9px; background: var(--paper);
  transition: background .2s, color .2s, gap .2s;
}
.card:hover .cta, .card:focus-visible .cta { background: var(--red); color: #fff; gap: 10px; }
.card.pulse .frame { animation: pulse 1.6s ease-out; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(215,38,30,.55), 0 10px 26px rgba(30,34,29,.12); }
  100% { box-shadow: 0 0 0 22px rgba(215,38,30,0), 0 10px 26px rgba(30,34,29,.12); }
}

/* Photos d'ambiance (non cliquables) */
.photo {
  position: absolute; left: 0; top: 0; z-index: 1;
  background: var(--frame); padding: 4px 4px 14px;
  box-shadow: 0 1px 2px rgba(30,34,29,.08), 0 6px 16px rgba(30,34,29,.1);
  pointer-events: none;
  will-change: transform;
}
.photo img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; filter: saturate(.85); }
.photo { opacity: .8; }
.photo img { filter: saturate(.6) contrast(.95); }
body.intro .photo { opacity: .25; }
.photo { transition: opacity .6s; }

/* ---------- Habillage ---------- */
.chrome { position: fixed; z-index: 20; }
#mark { top: calc(18px + env(safe-area-inset-top, 0px)); left: 20px; pointer-events: none; }
#mark canvas { display: block; width: 180px; height: auto; }
#mark p {
  margin: 6px 0 0;
  font: 400 11px/1.5 var(--mono); letter-spacing: .1em; text-transform: uppercase;
  color: var(--soft);
}
#mark p b { font-weight: 500; color: var(--ink); }

#tools {
  top: calc(18px + env(safe-area-inset-top, 0px)); right: 20px;
  display: flex; align-items: center; gap: 18px;
}
.langs { display: flex; gap: 2px; }
.langs button {
  background: none; border: 0; cursor: pointer;
  font: 500 12px/1 var(--mono); letter-spacing: .1em;
  color: var(--soft);
  padding: 8px 6px; border-radius: 4px;
}
.langs button:hover { color: var(--ink); }
.langs button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.langs button:focus-visible { outline: 2px solid var(--ink); }

#foot {
  left: 20px; right: 20px;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; justify-content: space-between; align-items: end; gap: 16px;
  font: 400 11px/1.5 var(--mono); letter-spacing: .1em; text-transform: uppercase;
  color: var(--soft);
  pointer-events: none;
}
#foot b { font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.qr { display: flex; align-items: end; gap: 10px; text-align: right; }
.qr .code { background: #fff; padding: 5px; box-shadow: 0 6px 18px rgba(30,34,29,.1); line-height: 0; }
.qr .code canvas, .qr .code img { display: block; width: 64px; height: 64px; }
.qr span { max-width: 18ch; }

.icon { display: block; color: var(--dot); }
.icon circle { fill: currentColor; }

button.dots {
  background: none; border: 0; padding: 10px; margin: -10px;
  cursor: pointer; color: var(--dot);
  transition: color .2s;
}
button.dots:hover { color: var(--ink); }
button.dots:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }

#demo {
  top: calc(22px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  z-index: 60;
  font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
  background: var(--ink); color: var(--paper);
  padding: 8px 12px; border-radius: 99px;
  display: flex; align-items: center; gap: 8px;
  pointer-events: none;
}
#demo::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #FF5A4A; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .2; } }

/* Curseur en points (souris uniquement) */
#cursor {
  position: fixed; left: 0; top: 0; z-index: 30;
  pointer-events: none;
  color: var(--ink);
  opacity: 0;
  transition: opacity .2s;
}
@media (pointer: fine) { body.has-cursor #cursor { opacity: 1; } }

/* ---------- Fiche projet : la vague ---------- */
#focus { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
#focus.on { pointer-events: auto; }
#focus:not(.on) .side, #focus:not(.on) .count { visibility: hidden; }
.flood {
  position: absolute; left: -5%; right: -5%; top: 0; height: 100%;
  background: var(--c, #A6E06A);
  transform: translateY(115%);
  transition: transform .9s cubic-bezier(.7,0,.2,1);
}
.flood svg { position: absolute; left: 0; bottom: 100%; width: 100%; height: 140px; display: block; }
.flood svg path { fill: var(--c, #A6E06A); }
#focus.on .flood { transform: translateY(0); }

.inner {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  padding-inline: 20px;
  padding-block: calc(56px + env(safe-area-inset-top, 0px)) calc(56px + env(safe-area-inset-bottom, 0px));
  opacity: 0;
  transition: opacity .3s;
  overflow-y: auto;
}
#focus.on .inner { opacity: 1; transition: opacity .5s .55s; }

.sheet {
  display: grid;
  grid-template-columns: auto minmax(0, 320px);
  align-items: end;
  gap: 36px;
  max-width: 100%;
}
.big {
  display: block; position: relative;
  background: var(--frame);
  padding: 8px; border: 0;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(30,34,29,.12), 0 30px 60px rgba(30,34,29,.22);
  transform: translateY(24px) rotate(-1.2deg);
  transition: transform .7s cubic-bezier(.2,.8,.2,1) .5s, box-shadow .3s;
}
#focus.on .big { transform: none; }
.big:hover { box-shadow: 0 2px 6px rgba(30,34,29,.12), 0 40px 70px rgba(30,34,29,.3); }
.big:focus-visible { outline: 2px solid var(--ink); outline-offset: 5px; }
.big canvas, .big img {
  display: block;
  max-width: min(56vw, 520px);
  max-height: 62vh;
  width: auto; height: auto;
}
.info { display: grid; gap: 14px; color: var(--ink); }
.info .k {
  font: 500 10px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase;
  color: rgba(30,34,29,.55);
}
.info h2 {
  margin: 0;
  font: 900 clamp(30px, 4.4vw, 52px)/.92 var(--title);
  letter-spacing: -.025em;
  text-transform: uppercase;
  text-wrap: balance;
}
.info p { margin: 0; font-size: 16px; line-height: 1.5; max-width: 34ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span {
  font: 400 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
  border: 1px solid rgba(30,34,29,.3); border-radius: 99px; padding: 6px 9px;
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.go {
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--ink); color: var(--paper);
  border: 1px solid var(--ink);
  text-decoration: none; cursor: pointer;
  font: 700 14px/1 var(--title); letter-spacing: .02em;
  padding: 14px 20px; border-radius: 99px;
  transition: gap .2s;
}
.go.ghost { background: transparent; color: var(--ink); }
.go:hover { gap: 16px; }
.go:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.pqr { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
.pqr .code { background: #fff; padding: 5px; line-height: 0; }
.pqr .code canvas, .pqr .code img { display: block; width: 72px; height: 72px; }
.pqr span { font: 400 10px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: rgba(30,34,29,.6); max-width: 22ch; }

.side { position: absolute; top: 50%; transform: translateY(-50%); }
#focus .side { color: rgba(30,34,29,.45); }
#focus .side:hover { color: var(--ink); }
#close { left: 24px; }
#next { right: 24px; }
#prev { left: 64px; }
#focus .count {
  position: absolute; left: 20px; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  font: 400 11px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase;
  color: rgba(30,34,29,.55);
}

/* ---------- Agrandissement (affiche, teaser) ---------- */
#zoom {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(14,16,13,.92);
  display: grid; place-items: center;
  padding: 24px;
  cursor: zoom-out;
}
#zoom img, #zoom video { max-width: 100%; max-height: calc(100vh - 48px); display: block; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
#zoom video { cursor: default; }
#zoomClose { position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); right: 20px; color: #9A9C97; }
#zoomClose:hover { color: #fff; }

@media (max-width: 720px) {
  #mark canvas { width: 118px; }
  .qr span { display: none; }
  .qr .code canvas, .qr .code img { width: 52px; height: 52px; }
  #foot > span:first-child { max-width: 24ch; }
  .sheet { grid-template-columns: 1fr; gap: 22px; justify-items: start; }
  .big canvas, .big img { max-width: calc(100vw - 72px); max-height: 40vh; }
  .pqr { display: none; }
  .side { top: auto; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: none; }
  #close { left: auto; right: 20px; top: calc(16px + env(safe-area-inset-top, 0px)); bottom: auto; }
  #prev { left: auto; right: 64px; }
  #next { right: 20px; }
  #focus .count { bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
}

@media (prefers-reduced-motion: reduce) {
  .flood, .inner, .big, .frame { transition-duration: .01s !important; transition-delay: 0s !important; }
  #demo::before { animation: none; }
}
</style>
</head>
<body>

<main id="stage"></main>

<div class="chrome" id="mark">
  <canvas id="wordmark" aria-label="Léa Tramati"></canvas>
  <p><b>Léa Tramati</b><br><span data-t="context"></span></p>
</div>
<div id="intro" aria-live="polite">
  <p class="hello" data-t="hello"></p>
  <p class="sub" data-t="sub"></p>
  <div class="hint"><span class="swipe" id="swipeIcon"></span><span data-t="hint"></span></div>
</div>
<div class="chrome" id="tools">
  <button class="about-btn" id="aboutBtn" type="button" data-t="about"></button>
  <div class="langs" role="group" aria-label="Langue / Language / Sprache">
    <button type="button" data-lang="fr" id="lang-fr">FR</button>
    <button type="button" data-lang="en" id="lang-en">EN</button>
    <button type="button" data-lang="de" id="lang-de">DE</button>
  </div>
  <button class="dots" id="full" type="button"></button>
</div>
<div class="chrome" id="foot">
  <span><b id="total">00</b> <span data-t="foot"></span></span>
  <div class="qr" aria-hidden="true">
    <span data-t="scanSite"></span>
    <div class="code" id="siteQr"></div>
  </div>
</div>
<div class="chrome" id="demo" hidden><span data-t="demo"></span></div>
<div id="cursor" aria-hidden="true"></div>

<section id="focus" aria-hidden="true">
  <div class="flood">
    <svg viewBox="0 0 1200 140" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 140 L0 96 C 180 112, 300 64, 520 40 C 760 14, 960 70, 1200 22 L1200 140 Z"></path>
    </svg>
  </div>
  <div class="inner">
    <div class="sheet">
      <a class="big" id="big"></a>
      <div class="info">
        <span class="k" id="fKind"></span>
        <h2 id="fTitle"></h2>
        <p id="fDesc"></p>
        <div class="tags" id="fTags"></div>
        <div class="actions" id="fActions"></div>
        <div class="process" id="fProcess"></div>
        <div class="pqr" aria-hidden="true">
          <div class="code" id="projQr"></div>
          <span id="fScan"></span>
        </div>
      </div>
    </div>
  </div>
  <button class="dots side" id="close" type="button"></button>
  <button class="dots side" id="prev" type="button"></button>
  <button class="dots side" id="next" type="button"></button>
  <span class="count" id="fCount"></span>
</section>

<div id="about" hidden>
  <aside class="panel" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
    <div class="top"><span class="k" data-t="about"></span><button class="dots" id="aboutClose" type="button"></button></div>
    <div class="portrait" id="portrait"></div>
    <h2 id="aboutTitle">Léa Tramati</h2>
    <p data-t="bio1"></p>
    <p data-t="bio2"></p>
    <dl>
      <dt data-t="where"></dt><dd>KISD — Köln International School of Design</dd>
      <dt data-t="what"></dt><dd data-t="fields"></dd>
      <dt>GitHub</dt><dd><a href="https://github.com/lea-tramati" target="_blank" rel="noopener">github.com/lea-tramati</a></dd>
    </dl>
  </aside>
</div>
<div id="zoom" hidden>
  <button class="dots" id="zoomClose" type="button"></button>
  <span id="zoomCount"></span>
  <div id="zoomBody"></div>
</div>

<script>
/* ═══════════════ RÉGLAGES ═══════════════
   SITE_URL : adresse publique du site (pour le QR code en bas à droite).
   Mode expo : ajouter #expo à la fin de l'adresse
     → démo automatique après 30 s sans activité,
     → les projets s'ouvrent dans le même onglet (le bouton retour revient ici). */
const SITE_URL = "https://lea-tramati.github.io/portfolio/";
const IDLE_SECONDS = 30;
const DEMO_STEP_SECONDS = 8;
/* Photo pour « À propos » : par ex. "vignettes/portrait.jpg" (vide : vos initiales en trame). */
const PORTRAIT = "";
/* Images de processus : ajouter process: ["vignettes/croquis.jpg", …] à un projet. */

/* ═══════════════ PROJETS ═══════════════
   type    : "lien" (ouvre une adresse) ou "affiche" (s'agrandit sur place)
   lien    : adresse ouverte (type "lien")
   image   : vignette ; video : (facultatif) teaser
   couleur : couleur de la vague ; format : "paysage", "portrait", "carre", "affiche" */

function rng(seed) {
  let h = 2166136261 >>> 0;
  for (const ch of String(seed)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return () => {
    h += 0x6D2B79F5;
    let x = h;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

function dotIcon(rows, cell = 5, r = 1.35) {
  const h = rows.length, w = rows[0].length;
  let s = `<svg class="icon" width="${w * cell}" height="${h * cell}" viewBox="0 0 ${w * cell} ${h * cell}" aria-hidden="true">`;
  rows.forEach((row, y) => [...row].forEach((c, x) => {
    if (c === "#") s += `<circle cx="${x * cell + cell / 2}" cy="${y * cell + cell / 2}" r="${r}"/>`;
  }));
  return s + "</svg>";
}

/* ═══════════════ Trame de points (logo) ═══════════════ */
function halftone(word, w, h, { bg, ink, seed }) {
  const r = rng(seed);
  const src = document.createElement("canvas");
  src.width = w; src.height = h;
  const g = src.getContext("2d", { willReadFrequently: true });
  g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
  g.fillStyle = "#fff";
  let size = h * 0.5;
  g.font = `900 ${size}px Gabarito, "Arial Black", sans-serif`;
  const m = g.measureText(word).width;
  if (m > w * 0.9) size *= (w * 0.9) / m;
  g.font = `900 ${size}px Gabarito, "Arial Black", sans-serif`;
  g.filter = `blur(${(size * 0.05).toFixed(1)}px)`;
  for (let i = 0; i < 2; i++) {
    g.beginPath();
    g.arc(w * (0.15 + r() * 0.7), h * (0.22 + r() * 0.56), size * 0.09, 0, 7);
    g.fill();
  }
  g.textAlign = "center"; g.textBaseline = "middle";
  g.save();
  g.translate(w / 2, h / 2);
  g.rotate((r() - 0.5) * 0.08);
  g.lineJoin = "round"; g.lineWidth = size * 0.07; g.strokeStyle = "#fff";
  g.strokeText(word, 0, 0);
  g.fillText(word, 0, 0);
  g.restore();
  g.filter = "none";
  const data = g.getImageData(0, 0, w, h).data;

  const out = document.createElement("canvas");
  out.width = w; out.height = h;
  const o = out.getContext("2d");
  o.fillStyle = bg; o.fillRect(0, 0, w, h);
  o.fillStyle = ink;
  const cell = Math.max(4, Math.round(Math.min(w, h) / 40));
  const rowH = cell * 0.866;
  for (let y = 0, row = 0; y < h + cell; y += rowH, row++) {
    for (let x = (row % 2) * cell / 2; x < w + cell; x += cell) {
      const ix = Math.min(w - 1, Math.max(0, Math.round(x))), iy = Math.min(h - 1, Math.max(0, Math.round(y)));
      const v = data[(iy * w + ix) * 4] / 255;
      const k = Math.min(1, Math.max(0, (v - 0.28) / 0.5));
      const rad = cell * 0.62 * (k * k * (3 - 2 * k));
      if (rad > 0.35) { o.beginPath(); o.arc(x, y, rad, 0, 7); o.fill(); }
    }
  }
  return out;
}

const RATIOS = { paysage: 4 / 3, portrait: 3 / 4, carre: 1, affiche: 1 / 1.414 };

}

const stage = $("stage");

const web = document.createElement("canvas");
web.id = "web";

function build() {

  items = liste.map((i, k) => {
    const p = PROJETS[i];

    const base = (small ? 110 : 160) + r() * (small ? 40 : 60);
    const w = Math.round(base * (ratio < 1 ? 0.8 : 1));
    const h = w / ratio + 10;
    const y = k % 2 ? vh * (small ? 0.46 : 0.48) + r() * vh * 0.06 : vh * (small ? 0.18 : 0.17) + r() * vh * 0.06;

    const b = document.createElement("button");

    const f = document.createElement("span");
    f.className = "frame";
    f.append(thumb(p, w * 2));
    const l = document.createElement("span");
    l.className = "label";
    l.innerHTML = '<span class="num"></span> <span></span><br><span></span>';
    l.children[0].textContent = pad(i + 1);
    l.children[1].textContent = p.titre;
    l.children[3].textContent = p.cat[lang];
    const cta = document.createElement("span");
    cta.className = "cta";
    cta.innerHTML = '<span></span><span aria-hidden="true">→</span>';
    cta.firstChild.textContent = t("cta");
    b.append(f, l, cta);
    b.addEventListener("click", e => { if (moved > 6) { e.preventDefault(); return; } openFocus(i, false, f); });
    if (p.video) {
      b.addEventListener("pointerenter", e => {
        if (e.pointerType !== "mouse") return;
        const v = document.createElement("video");
        v.src = p.video; v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true;
        v.style.setProperty("--r", String(ratio));
        f.replaceChildren(v);
        v.play().catch(() => {});
      });
      b.addEventListener("pointerleave", () => { if (f.querySelector("video")) f.replaceChildren(thumb(p, w * 2)); });
    }
    b.addEventListener("focus", () => ensureVisible(item));
    stage.append(b);
    const item = { el: b, base: k * gap + r() * gap * 0.3, y, depth: 1, w: w + 10, h, phase: r() * 6.28 };
    return item;
  });
  /* Photos d'ambiance : placées dans les espaces libres, sans recouvrir les projets ni l'en-tête */
  const boxes = items.map(it => ({ x: it.base - 14, y: it.y - 16, w: it.w + 28, h: it.h + 78 }));
  const top = vh * 0.15, bottom = vh * 0.84;
  photoItems = [];
  PHOTOS.forEach((src, j) => {
    const w = Math.round((small ? 54 : 70) + r() * (small ? 24 : 40));
    const h = w * 0.75 + 18;
    for (let tries = 0; tries < 40; tries++) {
      const x = ((j + r()) / PHOTOS.length) * world + (tries ? (r() - 0.5) * gap * 1.4 : 0);
      const y = top + r() * Math.max(10, bottom - top - h);
      const box = { x: x - 10, y: y - 10, w: w + 20, h: h + 20 };
      const hit = [...boxes].some(o => {
        const dx = mod(box.x - o.x + world / 2, world) - world / 2;
        return dx < o.w && -dx < box.w && box.y < o.y + o.h && o.y < box.y + box.h;

function sizeWeb() {
  const d = Math.min(2, devicePixelRatio || 1);
  web.width = Math.round(stage.clientWidth * d);
  web.height = Math.round(stage.clientHeight * d);
  web.style.width = stage.clientWidth + "px";
  web.style.height = stage.clientHeight + "px";
  web.getContext("2d").setTransform(d, 0, 0, d, 0, 0);
}

let mx = 0, my = 0, tmx = 0, tmy = 0;
function position(it, now, rot) {
  const x = mod(it.base - offset * it.depth, world) - 260;
  it.x = x;
  const bob = reduce ? 0 : Math.sin(now * 0.0007 + it.phase) * 7;
  it.sx = x + mx * 16;
  it.sy = it.y + bob + my * 10;
  it.el.style.transform = `translate3d(${it.sx.toFixed(1)}px, ${it.sy.toFixed(1)}px, 0)` + (rot ? ` rotate(${rot}deg)` : "");
  it.px = it.sx + it.w / 2;      // point d'attache (épingle)
  it.py = it.sy;
}
function place() {
  const now = performance.now();
  for (const it of photoItems) position(it, now, it.rot);
  for (const it of items) position(it, now);
  drawWeb();
}

function thread(ctx, a, b, sag) {
  const d = Math.hypot(b.px - a.px, b.py - a.py);
  ctx.beginPath();
  ctx.moveTo(a.px, a.py);
  ctx.quadraticCurveTo((a.px + b.px) / 2, (a.py + b.py) / 2 + d * sag, b.px, b.py);
  ctx.stroke();
}
function drawWeb() {
  const ctx = web.getContext("2d");
  const vw = stage.clientWidth, vh = stage.clientHeight;
  ctx.clearRect(0, 0, vw, vh);
  const vis = items.filter(it => it.px > -320 && it.px < vw + 320);
  ctx.lineCap = "round";
  /* fils entre photos voisines : la toile en arrière-plan */
  ctx.strokeStyle = "rgba(215,38,30,.22)"; ctx.lineWidth = 0.8;
  const pv = photoItems.filter(it => it.px > -200 && it.px < vw + 200);
  for (const p of pv) {
    let best = null, bd = 260;
    for (const q of pv) if (q !== p && q.px > p.px) { const d = Math.hypot(q.px - p.px, q.py - p.py); if (d < bd) { bd = d; best = q; } }
    if (best) thread(ctx, p, best, 0.1);
  }
  /* chaque photo est reliée au projet le plus proche */
  ctx.strokeStyle = "rgba(215,38,30,.45)"; ctx.lineWidth = 1;
  for (const p of pv) {
    let best = null, bd = 420;
    for (const q of vis) { const d = Math.hypot(q.px - p.px, q.py - p.py); if (d < bd) { bd = d; best = q; } }
    if (best) thread(ctx, p, best, 0.08);

  /* le fil rouge principal : chaque projet relié à ses deux voisins */
  ctx.strokeStyle = RED; ctx.lineWidth = 2;
  const done = new Set();
  vis.forEach((a, ia) => {
    vis.map((b, ib) => [ib, Math.hypot(b.px - a.px, b.py - a.py)])
      .filter(([ib, d]) => ib !== ia && d < 760)
      .sort((x, y) => x[1] - y[1]).slice(0, 2)
      .forEach(([ib]) => {
        const key = Math.min(ia, ib) + "-" + Math.max(ia, ib);
        if (done.has(key)) return;
        done.add(key);
        thread(ctx, a, vis[ib], 0.14);
      });
  });
}

/* Un projet visible « pulse » de temps en temps pour inviter au clic */
setInterval(() => {
  if (paused || reduce) return;
  const vw = stage.clientWidth;
  const vis = items.filter(it => it.sx > 40 && it.sx + it.w < vw - 40);
  if (!vis.length) return;
  const it = vis[Math.floor(Math.random() * vis.length)];
  it.el.classList.remove("pulse"); void it.el.offsetWidth; it.el.classList.add("pulse");
  setTimeout(() => it.el.classList.remove("pulse"), 1700);
}, 2600);

function ensureVisible(it) {
  const vw = stage.clientWidth;
  if (it.x < 40 || it.x + it.w > vw - 40) {
    offset += (it.x - vw / 2 + it.w / 2) / it.depth;

let paused = false;
function tick() {
  if (!paused) {
    vel *= 0.92;
    mx += (tmx - mx) * 0.05; my += (tmy - my) * 0.05;
    offset += vel + (hover ? 0 : DRIFT);
    place();
  }
  requestAnimationFrame(tick);
}

/* Glisser, molette, clavier */
let down = false, lastX = 0, moved = 0, hover = false;
stage.addEventListener("pointerdown", e => { down = true; moved = 0; lastX = e.clientX; vel = 0; });
addEventListener("pointermove", e => {
  cursor.style.transform = `translate(${e.clientX - 22}px, ${e.clientY - 6}px)`;
  if (e.pointerType === "mouse" && !reduce) { tmx = e.clientX / innerWidth - 0.5; tmy = e.clientY / innerHeight - 0.5; }
  document.body.classList.toggle("has-cursor", e.pointerType === "mouse" && !focusEl.classList.contains("on") && !!e.target.closest("#stage"));
  if (!down) return;
  const dx = e.clientX - lastX;
  lastX = e.clientX;
  moved += Math.abs(dx);
  if (moved > 6) stage.classList.add("dragging");
  offset -= dx; vel = -dx * 0.9;
}, { passive: true });
addEventListener("pointerup", () => { down = false; stage.classList.remove("dragging"); });
stage.addEventListener("wheel", e => {
  e.preventDefault();
  vel += (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * 0.06;
}, { passive: false });
stage.addEventListener("pointerover", e => { hover = !!e.target.closest(".card"); });
stage.addEventListener("pointerleave", () => { hover = false; document.body.classList.remove("has-cursor"); });

const cursor = $("cursor");
cursor.innerHTML = ICONS.drag;

/* ═══════════════ Fiche projet ═══════════════ */
const focusEl = $("focus");
let current = -1, lastFocus = null;

function action(label, onClick, ghost) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "go" + (ghost ? " ghost" : "");
  b.innerHTML = `<span></span><span aria-hidden="true">→</span>`;
  b.firstChild.textContent = label;
  b.addEventListener("click", onClick);
  return b;
}
function linkAction(p) {
  const a = document.createElement("a");
  a.className = "go"; a.href = p.lien;
  if (!EXPO) { a.target = "_blank"; a.rel = "noopener"; }
  a.innerHTML = `<span></span><span aria-hidden="true">↗</span>`;
  a.firstChild.textContent = t("open");
  return a;
}

function fill(i) {
  const p = PROJETS[i];
  focusEl.style.setProperty("--c", p.couleur);
  const big = $("big");
  big.replaceChildren(thumb(p, 900));
  big.onclick = null;
  if (p.type === "lien") {
    big.href = p.lien;
    if (EXPO) big.removeAttribute("target"); else { big.target = "_blank"; big.rel = "noopener"; }
    big.setAttribute("aria-label", `${t("open")} : ${p.titre}`);
  } else {
    big.removeAttribute("href"); big.removeAttribute("target");
    big.setAttribute("role", "button"); big.tabIndex = 0;
    big.setAttribute("aria-label", `${t("poster")} : ${p.titre}`);
    big.onclick = () => p.galerie ? zoom("img", p.galerie[0], p.galerie) : zoom("img", p.image);
    big.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); zoom("img", p.image); } };
  }
  $("fKind").textContent = p.cat[lang];
  $("fTitle").textContent = p.titre;
  $("fDesc").textContent = p.desc[lang];
  $("fTags").replaceChildren(...(p.tags || []).map(x => { const s = document.createElement("span"); s.textContent = x; return s; }));
  const acts = [];
  if (p.type === "lien") acts.push(linkAction(p));
  else if (p.type === "galerie") acts.push(action(t("photos"), () => zoom("img", p.galerie[0], p.galerie)));
  else acts.push(action(t("poster"), () => zoom("img", p.image)));
  if (p.video) acts.push(action(t("teaser"), () => zoom("video", p.video), true));
  $("fActions").replaceChildren(...acts);
  const list = p.galerie || p.process || [];
  $("fProcess").classList.toggle("gallery", !!p.galerie);
  $("fProcess").replaceChildren(...list.map(src => {
    const b = document.createElement("button"); b.type = "button";
    const img = new Image(); img.src = src; img.alt = ""; b.append(img);
    b.addEventListener("click", () => zoom("img", src, list));
    return b;
  }));
  $("fScan").textContent = t("scanProject");
  qr($("projQr"), projectUrl(p), 144);
  $("fCount").textContent = `${pad(i + 1)} / ${pad(PROJETS.length)}`;
}
function openFocus(i, quiet, fromEl) {
  if (current < 0) lastFocus = document.activeElement;
  hideIntro();
  current = i;
  fill(i);
  if (fromEl && !reduce) fly(fromEl);
  paused = true;
  focusEl.classList.add("on");
  focusEl.setAttribute("aria-hidden", "false");
  stage.inert = true;
  document.body.classList.remove("has-cursor");
  if (!quiet) setTimeout(() => $("fActions").firstChild?.focus({ preventScroll: true }), reduce ? 0 : 650);
}
function fly(fromEl) {
  const big = $("big");
  const r0 = fromEl.getBoundingClientRect();
  focusEl.classList.add("flip");
  const r1 = big.getBoundingClientRect();
  const c = fromEl.cloneNode(true);
  c.classList.add("flyer");
  Object.assign(c.style, { left: r0.left + "px", top: r0.top + "px", width: r0.width + "px" });
  document.body.append(c);
  const k = r1.width / r0.width;
  const a = c.animate([
    { transform: "translate(0, 0) scale(1)" },
    { transform: `translate(${r1.left - r0.left}px, ${r1.top - r0.top}px) scale(${k})` },
  ], { duration: 850, easing: "cubic-bezier(.7,0,.2,1)", fill: "forwards" });
  a.onfinish = () => { focusEl.classList.remove("flip"); requestAnimationFrame(() => c.remove()); };
}
function closeFocus() {
  if (current < 0) return;
  focusEl.classList.remove("on");
  focusEl.setAttribute("aria-hidden", "true");
  stage.inert = false;
  paused = false;
  current = -1;
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}
function shift(d) {
  if (current < 0) return;
  current = mod(current + d, PROJETS.length);
  fill(current);
}

/* Agrandissement */
const zoomEl = $("zoom");
let zoomList = null, zoomAt = 0;
function zoomShift(d) {
  if (!zoomList) return;
  zoomAt = mod(zoomAt + d, zoomList.length);
  zoom("img", zoomList[zoomAt], zoomList);
}
function zoom(kind, src, list) {
  const body = $("zoomBody");
  zoomList = list || null;
  zoomAt = list ? list.indexOf(src) : 0;
  $("zoomCount").textContent = list ? `${pad(zoomAt + 1)} / ${pad(list.length)}` : "";
  if (kind === "video") {
    const v = document.createElement("video");
    v.src = src; v.controls = true; v.autoplay = true; v.playsInline = true;
    v.addEventListener("click", e => e.stopPropagation());
    body.replaceChildren(v);
  } else {
    const img = new Image(); img.src = src; img.alt = "";
    if (list) img.addEventListener("click", e => { e.stopPropagation(); zoomShift(1); });
    body.replaceChildren(img);
  }
  zoomEl.hidden = false;
  $("zoomClose").focus({ preventScroll: true });
}
function unzoom() {
  if (zoomEl.hidden) return false;
  zoomEl.hidden = true;
  $("zoomBody").replaceChildren();
  return true;
}
zoomEl.addEventListener("click", unzoom);

/* ═══════════════ Accueil ═══════════════ */
function showIntro() { document.body.classList.add("intro"); }
function hideIntro() { document.body.classList.remove("intro"); }
stage.addEventListener("pointerdown", hideIntro);
stage.addEventListener("wheel", hideIntro, { passive: true });
stage.addEventListener("pointerover", e => { if (e.target.closest(".card")) hideIntro(); });
addEventListener("keydown", hideIntro);

/* ═══════════════ À propos ═══════════════ */
const aboutEl = $("about");
function openAbout() {
  hideIntro();
  const box = $("portrait");
  if (!box.firstChild) {
    if (PORTRAIT) { const img = new Image(); img.src = PORTRAIT; img.alt = "Léa Tramati"; box.append(img); }
    else box.append(halftone("LT", 420, 520, { bg: "#FF8FC7", ink: "#1E221D", seed: "portrait" }));
  }
  aboutEl.hidden = false;
  $("aboutClose").focus({ preventScroll: true });
}
function closeAbout() {
  if (aboutEl.hidden) return false;
  aboutEl.hidden = true;
  $("aboutBtn").focus({ preventScroll: true });
  return true;
}
$("aboutBtn").addEventListener("click", openAbout);
$("aboutClose").addEventListener("click", closeAbout);
aboutEl.addEventListener("click", e => { if (e.target === aboutEl) closeAbout(); });

/* ═══════════════ Démo automatique (mode expo) ═══════════════ */
let idleTimer = null, demoTimer = null, demoOn = false, demoIndex = -1;
function startDemo() {
  demoOn = true;
  $("demo").hidden = false;
  demoIndex = -1;
  closeAbout();
  closeFocus();
  showIntro();
  demoTimer = setTimeout(demoStep, 7000);
}
function demoStep() {
  unzoom();
  hideIntro();
  demoIndex = (demoIndex + 1) % PROJETS.length;
  if (current >= 0) {
    closeFocus();
    demoTimer = setTimeout(() => { openFocus(demoIndex, true); demoTimer = setTimeout(demoStep, DEMO_STEP_SECONDS * 1000); }, reduce ? 300 : 1300);
  } else {
    openFocus(demoIndex, true);
    demoTimer = setTimeout(demoStep, DEMO_STEP_SECONDS * 1000);
  }
}
function stopDemo() {
  clearTimeout(demoTimer);
  demoOn = false;
  $("demo").hidden = true;
  closeFocus();
  hideIntro();
}
function activity(e) {
  if (demoOn) {
    stopDemo();
    if (e && e.type !== "pointermove") { e.preventDefault?.(); e.stopPropagation?.(); }
  }
  if (!EXPO) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(startDemo, IDLE_SECONDS * 1000);
}
if (EXPO) {
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(ev => addEventListener(ev, activity, { capture: true, passive: false }));
  activity();
}

/* ═══════════════ Langue, plein écran, clavier ═══════════════ */
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  stage.setAttribute("aria-label", t("stage"));
  $("close").setAttribute("aria-label", t("close"));
  $("zoomClose").setAttribute("aria-label", t("close"));
  $("aboutClose").setAttribute("aria-label", t("close"));
  $("prev").setAttribute("aria-label", t("prev"));
  $("next").setAttribute("aria-label", t("next"));
  $("full").setAttribute("aria-label", t("full"));
  $("full").title = t("full");
  build();
  if (current >= 0) fill(current);
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("lang", lang); } catch {}
  applyLang();
}));

$("full").innerHTML = ICONS.full;
$("full").addEventListener("click", () => {
  const d = document;
  if (d.fullscreenElement) d.exitFullscreen?.().catch(() => {});
  else d.documentElement.requestFullscreen?.().catch(() => {});
});
if (!document.fullscreenEnabled) $("full").hidden = true;

$("close").innerHTML = ICONS.close;
$("zoomClose").innerHTML = ICONS.close;
$("aboutClose").innerHTML = ICONS.close;
$("swipeIcon").innerHTML = ICONS.drag;
$("prev").innerHTML = ICONS.prev;
$("next").innerHTML = ICONS.next;
$("close").addEventListener("click", closeFocus);
$("prev").addEventListener("click", () => shift(-1));
$("next").addEventListener("click", () => shift(1));

addEventListener("keydown", e => {
  if (e.key === "Escape" && (unzoom() || closeAbout())) return;
  if (!zoomEl.hidden) { if (e.key === "ArrowRight") zoomShift(1); if (e.key === "ArrowLeft") zoomShift(-1); return; }
  if (current >= 0) {
    if (e.key === "Escape") closeFocus();
    if (e.key === "ArrowRight") shift(1);
    if (e.key === "ArrowLeft") shift(-1);
    return;
  }
  if (e.key === "ArrowRight") vel += 6;
  if (e.key === "ArrowLeft") vel -= 6;
});

/* Logo en trame */
function drawMark() {
  const c = $("wordmark");
  const m = halftone("léa tramati", 600, 150, { bg: "#EFECE6", ink: "#1E221D", seed: "logo" });
  c.width = m.width; c.height = m.height;
  c.getContext("2d").drawImage(m, 0, 0);
}

/* Démarrage */
$("total").textContent = pad(PROJETS.length);
qr($("siteQr"), SITE_URL, 128);
applyLang();
drawMark();
if (!location.hash || EXPO) { showIntro(); setTimeout(() => { if (!demoOn) hideIntro(); }, 7000); }
let rs;
addEventListener("resize", () => { clearTimeout(rs); rs = setTimeout(build, 150); });
if (document.fonts) document.fonts.load("900 40px Gabarito").then(() => document.fonts.ready).then(() => { build(); drawMark(); });
requestAnimationFrame(tick);

/* Lien direct vers un projet : …/#feed-your-head */
const deep = PROJETS.findIndex(p => "#" + p.id === location.hash);
if (deep >= 0) openFocus(deep);
</script>
</body>
