<style>
/* Grille blanche, une police mono en capitales. Un seul thème, volontairement. Contrastes AA. */
:root {
  --paper: #FFFFFF;
  --ink: #111111;
  --soft: #5E5E5E;
  --line: #DADADA;
  --focus: #1F4BFF;
  --mono: "Space Mono", "Courier New", ui-monospace, monospace;
  --gx: 16px;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background: var(--paper); color: var(--ink);
  font: 400 13px/1.45 var(--mono);
  text-transform: uppercase; letter-spacing: .02em;
}
body.locked { overflow: hidden; }
body.nocursor, body.nocursor * { cursor: none !important; }
img { max-width: 100%; }
button { font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: fixed; left: 12px; top: -60px; z-index: 100; background: var(--ink); color: var(--paper); padding: 10px 14px; text-decoration: none; }
.skip:focus { top: 12px; }

/* Boutons à lettre cerclée : Ⓟ PROJETS, Ⓘ INFO */
.tab { display: inline-flex; align-items: center; gap: 9px; background: none; border: 0; padding: 4px 2px; cursor: pointer; text-decoration: none; min-height: 34px; }
.ic { width: 27px; height: 27px; border: 1.5px solid var(--ink); border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; line-height: 1; flex: none; }
.tab[aria-pressed="true"] .ic, .tab:hover .ic { background: var(--ink); color: var(--paper); }
.tab:hover .lb { text-decoration: underline; text-underline-offset: 3px; }

/* ---------- En-tête ---------- */
header {
  position: sticky; top: 0; z-index: 20; background: var(--paper);
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto; gap: 12px 28px; align-items: start;
  padding: calc(14px + env(safe-area-inset-top, 0px)) var(--gx) 14px;
}
.who { display: flex; gap: 10px; align-items: flex-start; }
.who img { width: 30px; height: 30px; display: block; margin-top: -3px; }
.who p { margin: 0; }
.who small { display: block; font-size: 12px; color: var(--soft); }
nav { display: flex; gap: 22px; flex-wrap: wrap; }
.tools { display: flex; gap: 18px; align-items: center; justify-self: end; }
.langs { display: flex; gap: 2px; }
.langs button { background: none; border: 0; cursor: pointer; padding: 6px 5px; min-height: 34px; color: var(--soft); }
.langs button[aria-pressed="true"], .langs button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.filters { display: flex; gap: 14px; align-items: flex-start; }
.filters ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: auto auto; gap: 0 22px; }
.filters li button { background: none; border: 0; cursor: pointer; padding: 1px 0; min-height: 24px; text-align: left; color: var(--soft); }
.filters li button:hover, .filters li button[aria-pressed="true"] { color: var(--ink); }
.filters li button[aria-pressed="true"] { text-decoration: underline; text-underline-offset: 3px; }
.filters sup { font-size: 9px; }
#hint { grid-column: 1 / -1; margin: 0; color: var(--soft); font-size: 12px; }
#hint kbd { font: inherit; color: var(--ink); border: 1px solid var(--ink); padding: 0 4px; }

/* ---------- Grille ---------- */
main { padding: 34px var(--gx) 0; }
.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 72px calc(var(--gx) * 2); align-items: end; }
.grid li { min-width: 0; }
.item { display: grid; gap: 12px; width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
.media { display: flex; align-items: flex-end; min-height: 0; }
.media img, .media video { display: block; width: 100%; height: auto; max-height: 380px; object-fit: cover; object-position: top; background: #F2F2F2; transition: opacity .2s; }
.media .tall { width: auto; max-width: 100%; }
.item:hover .media img, .item:hover .media video { opacity: .86; }
.cap { display: flex; justify-content: space-between; gap: 14px; padding-inline: 6px; }
.cap .t { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item:hover .cap .t, .item:focus-visible .cap .t { text-decoration: underline; text-underline-offset: 3px; }
.item:focus-visible { outline: none; }
.item:focus-visible .media { outline: 3px solid var(--focus); outline-offset: 4px; }

/* ---------- Pied de page ---------- */
footer { margin-top: 110px; padding: 18px var(--gx) calc(22px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: end; gap: 20px; flex-wrap: wrap; color: var(--soft); }
footer p { margin: 0; }
.qr { display: flex; align-items: end; gap: 12px; }
.code { background: #fff; line-height: 0; }
.code canvas, .code img { display: block; width: 74px; height: 74px; }

/* ---------- Fiche projet ---------- */
#focus { position: fixed; inset: 0; z-index: 40; background: var(--paper); overflow-y: auto; opacity: 0; visibility: hidden; transition: opacity .35s, visibility 0s .35s; }
#focus.on { opacity: 1; visibility: visible; transition: opacity .35s; }
.fbar { position: sticky; top: 0; z-index: 2; background: var(--paper); display: flex; gap: 24px; align-items: center; padding: calc(14px + env(safe-area-inset-top, 0px)) var(--gx) 14px; flex-wrap: wrap; }
.fbar .count { color: var(--soft); }
.fbar #close { margin-left: auto; }
.sheet { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 40px; align-items: end; padding: 24px var(--gx) 60px; min-height: calc(100vh - 70px); }
.big { display: block; line-height: 0; cursor: pointer; justify-self: start; }
.big img { display: block; max-width: 100%; max-height: 76vh; width: auto; height: auto; }
.info { display: grid; gap: 16px; align-content: end; }
.info .k { color: var(--soft); }
.info h2 { margin: 0; font: 700 clamp(28px, 3.6vw, 52px)/1 var(--mono); letter-spacing: -.01em; overflow-wrap: anywhere; }
.info p { margin: 0; text-transform: none; letter-spacing: 0; font-size: 15px; line-height: 1.6; max-width: 46ch; }
.tags { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--soft); }
.tags li::before { content: "["; } .tags li::after { content: "]"; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 10px; border: 1.5px solid var(--ink); background: var(--paper); padding: 11px 15px 10px; min-height: 44px; cursor: pointer; text-decoration: none; }
.btn.solid, .btn:hover { background: var(--ink); color: var(--paper); }
.process { list-style: none; margin: 0; padding: 2px; display: flex; flex-wrap: wrap; gap: 4px; max-height: 160px; overflow-y: auto; }
.process:empty { display: none; }
.process button { padding: 0; border: 0; cursor: zoom-in; line-height: 0; }
.process img { width: 54px; height: 54px; object-fit: cover; }
.pqr { display: flex; align-items: center; gap: 12px; color: var(--soft); font-size: 11px; }
.pqr .code canvas, .pqr .code img { width: 70px; height: 70px; }
.flyer { position: fixed; z-index: 45; margin: 0; pointer-events: none; transform-origin: 0 0; }
#focus.flip .big { opacity: 0; }

/* ---------- Agrandissement ---------- */
#zoom { position: fixed; inset: 0; z-index: 50; background: rgba(255,255,255,.98); display: grid; place-items: center; padding: 70px 80px; }
#zoom figure { margin: 0; display: grid; gap: 10px; justify-items: center; }
#zoom img, #zoom video { max-width: 100%; max-height: calc(100vh - 170px); display: block; }
#zoom video { background: #000; }
#zoomClose { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: var(--gx); }
.zarrow { position: absolute; top: 50%; transform: translateY(-50%); }
#zoomPrev { left: var(--gx); }
#zoomNext { right: var(--gx); }

/* ---------- Info ---------- */
#about { position: fixed; inset: 0; z-index: 55; display: flex; justify-content: flex-end; background: rgba(17,17,17,.25); }
#about .panel { width: min(520px, 100%); height: 100%; overflow-y: auto; background: var(--paper); padding: calc(14px + env(safe-area-inset-top, 0px)) 24px 28px; display: grid; align-content: start; gap: 22px; }
#about .top { display: flex; justify-content: flex-end; }
#about .portrait { width: 50%; aspect-ratio: 4 / 5; background: #F2F2F2; display: grid; place-items: center; overflow: hidden; }
#about .portrait img { width: 60%; }
#about .portrait img.real { width: 100%; height: 100%; object-fit: cover; }
#about h2 { margin: 0; font: 700 34px/1 var(--mono); }
#about p { margin: 0; text-transform: none; letter-spacing: 0; font-size: 15px; line-height: 1.6; }
#about dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; }
#about dt { color: var(--soft); }
#about dd { margin: 0; overflow-wrap: anywhere; }

/* ---------- Bande-démo (mode expo) ---------- */
#reel { position: fixed; inset: 0; z-index: 70; background: #0E0E0E; color: #F4F4F1; overflow: hidden; cursor: pointer; }
#reelStage { position: absolute; inset: 0; }
.slide { position: absolute; inset: 0; display: grid; place-items: center; padding: 6vh 6vw 22vh; opacity: 0; transition: opacity .9s ease; }
.slide.in { opacity: 1; }
.slide img, .slide video { position: relative; z-index: 1; display: block; max-width: 86vw; max-height: 66vh; width: auto; height: auto; }
.slide.kb img { animation: kb 7.5s ease-out forwards; }
@keyframes kb { from { transform: scale(1); } to { transform: scale(1.05); } }
.slide .bg { position: absolute; inset: -60px; z-index: 0; background-size: cover; background-position: center; filter: blur(50px) brightness(.3); }
.r-text { position: absolute; z-index: 2; left: 4vw; right: 4vw; bottom: 6vh; display: flex; justify-content: space-between; align-items: end; gap: 3vw; }
.r-k { font-size: clamp(16px, 2vw, 30px); }
.r-t { margin: 0; font: 700 clamp(40px, 7vw, 120px)/.95 var(--mono); text-align: right; }
.r-text { transition: opacity .5s; }
#reel.swap .r-text { opacity: 0; }
.r-cta { position: absolute; z-index: 2; top: 4vh; left: 4vw; display: inline-flex; gap: 10px; align-items: center; font-size: clamp(13px, 1.1vw, 17px); }
.r-cta .ic { border-color: #F4F4F1; animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.r-bar { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.15); }
.r-bar span { display: block; height: 100%; width: 0; background: #F4F4F1; }
body.still .slide.kb img, body.still .r-cta .ic { animation: none; }

@media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 760px) {
  header { grid-template-columns: 1fr auto; }
  nav { grid-column: 1 / -1; grid-row: 2; }
  .filters { grid-column: 1 / -1; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px 10px; }
  .media img, .media video { max-height: 300px; }
  .cap { flex-direction: column; gap: 2px; }
  .cap .t { text-align: left; white-space: normal; }
  .sheet { grid-template-columns: 1fr; gap: 24px; }
  .big img { max-height: 46vh; }
  .pqr { display: none; }
  #zoom { padding: 70px 12px 100px; }
  .zarrow { top: auto; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: none; }
}
</style>
</head>

/* Flèches du clavier dans la grille (← → ↑ ↓, Début, Fin) */
grid.addEventListener("keydown", e => {

  const cols = getComputedStyle(grid).gridTemplateColumns.split(" ").length;
  const moves = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols, Home: -at, End: vis.length - 1 - at };
  if (!(e.key in moves)) return;
  e.preventDefault();
  const to = Math.max(0, Math.min(vis.length - 1, at + moves[e.key]));
  vis[to].b.focus();
  vis[to].b.scrollIntoView({ block: "nearest", behavior: still ? "auto" : "smooth" });
});

function fly(fromEl) {
  const target = $("big").firstChild;
  focusEl.classList.add("flip");
  const r0 = fromEl.getBoundingClientRect(), r1 = target.getBoundingClientRect();
  if (!r0.width || !r1.width) { focusEl.classList.remove("flip"); return; }
  const c = fromEl.cloneNode(true);
  c.className = "flyer"; c.setAttribute("aria-hidden", "true");
  Object.assign(c.style, { left: r0.left + "px", top: r0.top + "px", width: r0.width + "px", height: r0.height + "px", objectFit: "cover" });
  document.body.append(c);
  const a = c.animate([
    { transform: "translate(0, 0) scale(1)" },
    { transform: `translate(${r1.left - r0.left}px, ${r1.top - r0.top}px) scale(${r1.width / r0.width}, ${r1.height / r0.height})` },
  ], { duration: 650, easing: "cubic-bezier(.6,0,.2,1)", fill: "forwards" });
  a.onfinish = () => { focusEl.classList.remove("flip"); requestAnimationFrame(() => c.remove()); };
}
function closeFocus() {
  if (current < 0) return;
  focusEl.classList.remove("on");
  focusEl.setAttribute("aria-hidden", "true");
  const back = cards[current]?.b;
  current = -1;
  syncInert();
  back?.focus({ preventScroll: true });
  back?.scrollIntoView({ block: "nearest" });
}
function shift(d) {
  if (current < 0) return;
  let i = current;
  for (let k = 0; k < N; k++) { i = mod(i + d, N); if (visible(PROJETS[i])) break; }
  current = i;
  fill(i);
  announce(T[lang].now(i + 1, N, PROJETS[i]));
}

/* ═══════════════ Agrandissement ═══════════════ */
let zoomList = [], zoomAt = 0, zoomProject = null, zoomReturn = null;
function zoom(list, at, p) {
  if (zoomEl.hidden) zoomReturn = document.activeElement;
  zoomList = list; zoomAt = at; zoomProject = p;
  const src = list[at];
  const many = list.length > 1;
  $("zoomPrev").hidden = $("zoomNext").hidden = !many;
  let cap;
  if (isVideo(src)) {
    const v = document.createElement("video");
    v.src = src; v.controls = true; v.playsInline = true; v.autoplay = !still;
    cap = p.videoTitles ? T[lang].videoOf(at + 1, list.length, p.videoTitles[at]) : p.titre;
    v.setAttribute("aria-label", cap);
    if (many) v.addEventListener("ended", () => zoomShift(1));
    $("zoomBody").replaceChildren(v);
  } else {
    const im = new Image(); im.src = src;
    if (p.galerie) { cap = T[lang].photoOf(at + 1, list.length); im.alt = cap; }
    else { cap = p.titre; im.alt = p.alt[lang]; }
    $("zoomBody").replaceChildren(im);
  }
  $("zoomCap").textContent = cap;
  zoomEl.hidden = false;
  syncInert();
  $("zoomClose").focus({ preventScroll: true });
  if (many) announce(cap);
}
function zoomShift(d) { if (zoomList.length > 1) zoom(zoomList, mod(zoomAt + d, zoomList.length), zoomProject); }
function unzoom() {
  if (zoomEl.hidden) return false;
  zoomEl.hidden = true;
  $("zoomBody").replaceChildren();
  syncInert();
  zoomReturn?.focus?.({ preventScroll: true });
  return true;
}
zoomEl.addEventListener("click", e => { if (e.target === zoomEl) unzoom(); });
$("zoomClose").addEventListener("click", unzoom);
$("zoomPrev").addEventListener("click", () => zoomShift(-1));
$("zoomNext").addEventListener("click", () => zoomShift(1));

/* ═══════════════ Info ═══════════════ */
let aboutReturn = null;
function openAbout() {
  if (aboutEl.hidden) aboutReturn = document.activeElement;
  const box = $("portrait");
  const im = new Image();
  if (PORTRAIT) { im.src = PORTRAIT; im.alt = "Léa Tramati"; im.className = "real"; } else { im.src = "vignettes/logo.png"; im.alt = "Logo LT"; }
  box.replaceChildren(im);
  const c = $("contact");
  if (CONTACT) { const a = document.createElement("a"); a.href = CONTACT.href; a.target = "_blank"; a.rel = "noopener"; a.textContent = CONTACT.label; c.replaceChildren(a); }
  else c.textContent = t("noContact");
  aboutEl.hidden = false;
  $("navAbout").setAttribute("aria-pressed", "true"); $("navWork").setAttribute("aria-pressed", "false");
  syncInert();
  $("aboutClose").focus({ preventScroll: true });
}
function closeAbout() {
  if (aboutEl.hidden) return false;
  aboutEl.hidden = true;
  $("navAbout").setAttribute("aria-pressed", "false"); $("navWork").setAttribute("aria-pressed", "true");
  syncInert();
  aboutReturn?.focus?.({ preventScroll: true });
  return true;
}
$("navAbout").addEventListener("click", openAbout);
$("navWork").addEventListener("click", () => { closeAbout(); closeFocus(); scrollTo({ top: 0 }); });
$("aboutClose").addEventListener("click", closeAbout);
aboutEl.addEventListener("click", e => { if (e.target === aboutEl) closeAbout(); });

/* ═══════════════ Pause ═══════════════ */
function applyStill() {
  document.body.classList.toggle("still", still);
  $("pause").setAttribute("aria-pressed", String(still));
  $("pause").querySelector(".ic").textContent = still ? "▶" : "‖";
  $("pauseLb").textContent = still ? t("play") : t("pause");
  $("pause").setAttribute("aria-label", still ? t("playLabel") : t("pauseLabel"));
}
$("pause").addEventListener("click", () => {
  still = !still;
  try { localStorage.setItem("still", still ? "1" : "0"); } catch {}
  applyStill();
});

/* ═══════════════ Bande-démo (mode expo) ═══════════════ */
let idleTimer = null, demoTimer = null, demoOn = false, demoIndex = -1;
const reelEl = $("reel");
function demoStep() {
  demoIndex = (demoIndex + 1) % N;
  const p = PROJETS[demoIndex];
  const st = $("reelStage");
  const slide = document.createElement("div");
  slide.className = "slide" + (still ? "" : " kb");
  const bg = document.createElement("div"); bg.className = "bg"; bg.style.backgroundImage = `url("${p.image}")`;
  slide.append(bg);
  const vid = !still && (p.preview || p.video);
  if (vid) { const v = document.createElement("video"); v.src = vid; v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true; v.poster = p.image; slide.append(v); v.play().catch(() => {}); }
  else { const im = new Image(); im.src = p.image; im.alt = ""; slide.append(im); }
  st.append(slide);
  reelEl.classList.add("swap");
  setTimeout(() => slide.classList.add("in"), 40);
  setTimeout(() => {
    $("reelKind").textContent = `${pad3(demoIndex + 1)} — ${p.cat[lang]}`;
    $("reelTitle").textContent = p.titre;
    reelEl.classList.remove("swap");
  }, 450);
  [...st.children].slice(0, -1).forEach(old => { old.classList.remove("in"); setTimeout(() => old.remove(), 1000); });
  const bar = $("reelBar");
  bar.getAnimations?.().forEach(x => x.cancel());
  bar.animate?.([{ width: "0%" }, { width: "100%" }], { duration: DEMO_STEP_SECONDS * 1000, easing: "linear", fill: "forwards" });
  demoTimer = setTimeout(demoStep, DEMO_STEP_SECONDS * 1000);
}
function startDemo() {
  if (demoOn) return;
  demoOn = true;
  unzoom(); closeAbout(); closeFocus();
  filtre = "all"; renderFilters(); applyFilter(); scrollTo({ top: 0 });
  demoIndex = -1;
  $("reelCta").textContent = t("demo");
  $("reelStage").replaceChildren();
  reelEl.hidden = false;
  demoStep();
}
function stopDemo() {
  clearTimeout(demoTimer);
  demoOn = false;
  reelEl.hidden = true;
  $("reelStage").replaceChildren();
}
function activity(e) {
  if (demoOn) { stopDemo(); if (e && e.cancelable) { e.preventDefault(); e.stopPropagation(); } }
  if (!EXPO) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(startDemo, IDLE_SECONDS * 1000);
}
if (EXPO) {
  let cur;
  addEventListener("pointermove", () => { document.body.classList.remove("nocursor"); clearTimeout(cur); cur = setTimeout(() => document.body.classList.add("nocursor"), 3000); }, { passive: true });
  ["pointerdown", "keydown", "wheel", "touchstart", "scroll"].forEach(ev => addEventListener(ev, activity, { capture: true, passive: ev === "scroll" }));
  activity();
}

/* ═══════════════ Langue, plein écran, clavier ═══════════════ */
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("langs").setAttribute("aria-label", t("langs"));
  $("skip").textContent = t("skip");
  $("hint").innerHTML = t("hint");
  $("prev").setAttribute("aria-label", t("prevLabel"));
  $("next").setAttribute("aria-label", t("nextLabel"));
  $("zoomPrev").setAttribute("aria-label", t("prevItem"));
  $("zoomNext").setAttribute("aria-label", t("nextItem"));
  $("full").setAttribute("aria-label", t("full")); $("full").title = t("full");
  qr($("siteQr"), SITE_URL, 148, t("qrSite"));
  applyStill(); renderFilters(); build();
  if (current >= 0) fill(current);
  if (!aboutEl.hidden) openAbout();
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("lang", lang); } catch {}
  applyLang();
  $("lang-" + lang).focus();
}));
$("full").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  else document.documentElement.requestFullscreen?.().catch(() => {});
});
if (!document.fullscreenEnabled) $("full").hidden = true;
$("close").addEventListener("click", closeFocus);
$("prev").addEventListener("click", () => shift(-1));
$("next").addEventListener("click", () => shift(1));
$("skip").addEventListener("click", e => { e.preventDefault(); cards.find(c => !c.li.hidden)?.b.focus(); });

addEventListener("keydown", e => {
  if (e.key === "Escape") { if (unzoom() || closeAbout()) return; if (current >= 0) { closeFocus(); return; } }
  if (!zoomEl.hidden) {
    if (e.key === "ArrowRight") { e.preventDefault(); zoomShift(1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); zoomShift(-1); }
    return;
  }
  if (current >= 0 && aboutEl.hidden && document.activeElement?.tagName !== "VIDEO") {
    if (e.key === "ArrowRight") shift(1);
    if (e.key === "ArrowLeft") shift(-1);
  }
});

/* ═══════════════ Démarrage ═══════════════ */
applyLang();
const deep = PROJETS.findIndex(p => "#" + p.id === location.hash);
if (deep >= 0) openFocus(deep, true);
</script>
